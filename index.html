// The winner's ship (left) torpedoes each rival (right) in turn; hit ships tip over and sink.
// focus: a loser's close-up of their own ship (big) instead of the wide shot of every rival.
function battleView(r, rivals, line, focus = false) {
  const W = 360, sea = 150, win = r.winners[0];
  const s = focus ? 0.8 : Math.min(0.42, 180 / (rivals.length * 220)), gap = (W - 150) / rivals.length;
  let rivalsSvg = '', shots = '';
  rivals.forEach((id, i) => {
    const x = 150 + i * gap + (gap - 220 * s) / 2, cx = x + 110 * s, hit = BATTLE.start + i * BATTLE.gap + BATTLE.travel;
    const dodge = gagAt(id, 'torpedo'); // GAGS.ch: the torpedo swerves under the ship, which stays afloat
    rivalsSvg += `<g transform="translate(${x.toFixed(1)} ${(sea - 92 * s).toFixed(1)}) scale(${s.toFixed(3)})"${lookStyle(lookOfId(id))}>
      <g${dodge ? '' : ` class="sinking" style="--d:${hit.toFixed(2)}s;--t:${BATTLE.sink}s"`}>${shipBody(r.inventories[id] / GOAL, 'sunk' + id, lookOfId(id)).ship}</g></g>`;
    if (dodge) {
      const capX = Math.min(W - 54, Math.max(54, cx)), capY = sea - 92 * s - 6;
      shots += `<g class="torp swerve" style="--d:${(hit - BATTLE.travel).toFixed(2)}s;--t:${(BATTLE.travel * 1.6).toFixed(2)}s;--dx:${(cx - 118).toFixed(0)}px"><path d="M100 ${sea + 5}h14" stroke="#fff" stroke-width="2" opacity=".8"/>
        <rect x="112" y="${sea + 3}" width="12" height="4" rx="2" fill="#22313F"/></g>
        <g class="gag-caption" style="--d:${hit.toFixed(2)}s"><rect x="${capX - 52}" y="${(capY - 15).toFixed(1)}" width="104" height="16" rx="8" fill="#fff" stroke="#D52B1E" stroke-width="1.5"/>
        <text x="${capX}" y="${(capY - 4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#D52B1E" font-family="Figtree,system-ui,sans-serif">${esc(dodge.caption)}</text></g>`;
      return;
    }
    shots += `<g class="torp" style="--d:${(hit - BATTLE.travel).toFixed(2)}s;--t:${BATTLE.travel}s;--dx:${(cx - 118).toFixed(0)}px"><path d="M100 ${sea + 5}h14" stroke="#fff" stroke-width="2" opacity=".8"/>
      <rect x="112" y="${sea + 3}" width="12" height="4" rx="2" fill="#22313F"/></g>
      <circle class="boom" style="--d:${hit.toFixed(2)}s" cx="${cx.toFixed(0)}" cy="${sea - 4}" r="16" fill="#FF9F1C"/>
      <circle class="boom" style="--d:${(hit + 0.1).toFixed(2)}s" cx="${cx.toFixed(0)}" cy="${sea - 4}" r="9" fill="#FFD60A"/>
      ${[0, 1, 2].map(k => `<circle class="bubble" style="--d:${(hit + 1 + k * 0.35).toFixed(2)}s" cx="${(cx - 6 + k * 6).toFixed(0)}" cy="${sea + 10}" r="${2 + k % 2}" fill="#fff" opacity="0"/>`).join('')}
      <use class="flotsam" style="--d:${(hit + BATTLE.sink * 0.8).toFixed(2)}s" href="#nana" x="${(cx - 9).toFixed(0)}" y="${sea + 6}" width="18" height="9"/>`;
  });
  const wb = shipBody(0.85, 'battle' + win, lookOfId(win)).ship; // drawn riding high so the attacker reads clearly
  return `<div class="battle${focus ? ' focus' : ''}"><svg viewBox="${focus ? '0 50 360 140' : `0 84 ${W} 106`}" style="display:block;width:100%">
    ${waves(sea - 4, W, 190, 'sh-sea2')}
    <g transform="translate(4 ${(sea - 92 * 0.62).toFixed(1)}) scale(0.62)"${lookStyle(lookOfId(win))}>${wb}</g>${rivalsSvg}
    ${waves(sea + 1, W, 190, 'sh-sea sh-wave')}${shots}</svg><p>${line}</p></div>`;
}
function sheetView() {
  const r = S.room.lastResult;
  if (S.sheetFor == null || !r || r.round !== S.sheetFor) return '';
  const ids = S.room.order.slice().sort((a, b) => r.bids[b] - r.bids[a]);
  const top = r.bids[ids[0]], age = gagAge(`${S.room.code}|sheet|${r.round}`).toFixed(2);
  return `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-label="Round results">
    <h2>Round ${r.round} results</h2><p class="sheet-cargo"><span class="num">${r.pot} 🍌</span> were up for auction this round</p>
    ${bongoSays(r.steps.flatMap(stepLines).map(l => `<p>${l}</p>`).join(''), 'wide')}
    <ul class="reveal">${ids.map((id, i) => { const b = r.before[id], a = r.after[id], d = a - b;
      const trig = resultTriggers(id, r);
      return `<li class="${r.bids[id]===top?'top':''}" style="animation-delay:${(i * 0.12 - age).toFixed(2)}s;--age:${age}s">${tile(a / GOAL, true, id, { ...lookOfId(id), gagWon: trig.includes('won') })}
        <span class="who"><b>${esc(nickOf(id))}${id===S.room.me?' (you)':''}</b>
        <span class="small">Bananas ${b} → <b>${a}</b> <span class="delta ${d>0?'up':d<0?'down':''}">(${d>0?'+'+d:d<0?'−'+(-d):'no change'})</span></span></span>
        <span class="bid"><span class="small muted">Bid</span><span class="num">${r.bids[id]}</span></span>${gagRow(id, a, trig)}</li>`; }).join('')}</ul>
    <div class="sheet-foot"><button class="primary wide" onclick="closeSheet()">${S.room.status !== 'over' ? 'Next round'
      : S.room.winners.includes(S.room.me) ? 'Enjoy the victory' : S.room.order.includes(S.room.me) ? 'Mourn the defeat' : 'See the winner'}</button></div></div></div>`;
}
// ---------- flag picker sheet ----------
async function loadCountries() {
  try {
    const r = await fetch(FLAG_CDN + 'country.json');
    if (!r.ok) throw new Error();
    S.countries = (await r.json()).filter(c => c.iso || FLAG_EXTRAS.includes(c.code))
      .map(c => ({ code: c.code, name: c.name })).sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { S.countries = 'error'; }
  if (S.flagSheet) fillFlags();
}
function openFlags(e) {
  if (e) e.stopPropagation();
  S.flagSheet = true; S.flagQuery = '';
  S.secretSpots = Object.fromEntries(SECRET_FLAGS.map(k => [k, Math.random()])); // hide-and-seek spots for this visit
  if (!Array.isArray(S.countries)) { S.countries = null; loadCountries(); }
  render();
}
// Toasts show one at a time, each for its usual time; a burst keeps only the newest few.
const toastQueue = [];
let toastShowing = false;
function toast(text) {
  toastQueue.push(text);
  if (toastQueue.length > 4) toastQueue.shift();
  if (!toastShowing) nextToast();
}
function nextToast() {
  const text = toastQueue.shift();
  if (text === undefined) { toastShowing = false; return; }
  toastShowing = true;
  const el = document.createElement('p'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = text;
  document.body.appendChild(el); setTimeout(() => { el.remove(); nextToast(); }, 2600);
}
// ---------- ship shop ----------
const shopButton = () => `<button class="shopbtn" onclick="openShop()">🪙 Shop</button>`;
const setShop = on => act(() => api('settings', { shop: on }));
const SHOP_TABS = [['sabotage', '💣 Sabotage'], ['defence', '🛡️ Defence'], ['gift', '🎁 Gifts'], ['bling', '✨ Bling'], ['emote', '📯 Emotes']];
const EMOTE_TEXT = { honk: '📯 HONK!', ha: 'Ha!', oops: 'Oops', ouch: 'Ouch' };
function openShop(tab) { S.shopSheet = true; S.error = ''; if (tab) S.shopTab = tab; if (!S.catalog) loadCatalog().then(render); render(); }
function closeShop() { S.shopSheet = null; S.error = ''; render(); }
function shopView() {
  if (!S.shopSheet || !S.room) return '';
  const r = S.room, w = r.wallet, cat = S.catalog && S.catalog.catalog;
  const tabs = SHOP_TABS.filter(([k]) => k !== 'sabotage' || (r.status === 'playing' && r.order.includes(r.me))); // spectators can't sabotage
  if (!tabs.some(([k]) => k === S.shopTab)) S.shopTab = tabs[0][0];
  let body;
  if (!cat || !w) body = `<p class="muted">${!w ? 'The shop is closed right now.' : 'Opening the shop…'}</p>`;
  else if (S.shopTab === 'emote') body = `<div class="shopgrid">${Object.keys(EMOTE_TEXT).map(k => `<button class="shopitem" onclick="sendEmote('${k}')"><span class="icon">${EMOTE_TEXT[k]}</span><span>Free</span></button>`).join('')}</div>`;
  else {
    const items = r.market.filter(k => cat[k] && cat[k].kind === S.shopTab);
    const owned = S.shopTab === 'bling' ? w.owned.filter(k => cat[k] && !items.includes(k)) : [];
    body = `<div class="shopgrid">${[...items, ...owned].map(k => {
      const it = cat[k], have = S.shopTab === 'bling' && w.owned.includes(k), stock = S.shopTab === 'defence' ? (w.stock[k] || 0) : 0;
      const label = have ? (w.worn.includes(k) ? 'Wearing · tap to remove' : 'Owned · tap to wear') : `${it.price} 🪙${stock ? ` · you have ${stock}` : ''}`;
      const poor = !have && w.credits < it.price;
      return `<button class="shopitem${poor ? ' poor' : ''}" onclick="${have ? `wearItem('${k}', ${!w.worn.includes(k)})` : `buyItem('${k}')`}"><span class="icon">${it.icon}</span><b>${esc(it.name)}</b><span>${label}</span></button>`;
    }).join('') || '<p class="muted">Nothing of this kind on sale this game.</p>'}</div>`;
  }
  return `<div class="sheet-bg" onclick="if(event.target===this)closeShop()"><div class="sheet" role="dialog" aria-label="Shop">
    <div class="topbar"><h2>Today's market</h2><button class="link" onclick="closeShop()">Done</button></div>
    <p class="small muted" style="margin-top:-6px">🪙 ${w ? w.credits : 0} · New stock every game.</p>
    <div class="shoptabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.shopTab === k}" onclick="S.shopTab='${k}';S.error='';render()">${l}</button>`).join('')}</div>
    ${S.error ? `<p class="err" role="alert">${esc(S.error)}</p>` : ''}
    ${body}</div></div>`;
}
function buyItem(k) {
  const it = S.catalog.catalog[k];
  if (it.kind === 'sabotage' || it.kind === 'gift') { S.targeting = { item: k }; S.shopSheet = null; return render(); }
  act(async () => { await api('buy', { item: k }); });
}
function pickTarget(id) {
  const k = S.targeting.item; S.targeting = null;
  act(async () => { await api('buy', { item: k, target: id }); });
}
const sendEmote = k => { S.shopSheet = null; act(() => api('emote', { kind: k })); };
const wearItem = (k, on) => act(() => api('wear', { item: k, on }));
// Captain Bongo announces each new effect once, on every screen.
function fxText(e) {
  const n = id => esc(nickOf(id)), it = S.catalog && S.catalog.catalog[e.kind];
  if (e.kind === 'emote') return '';
  if (!it) return '';
  if (e.blocked) return { hose: `🧯 ${n(e.target)} hosed down ${n(e.from)}'s bomb!`, umbrella: `☂️ ${n(e.target)} popped an umbrella over ${n(e.from)}'s rain cloud!`,
    bubble: `🫧 ${n(e.target)}'s bubble shield popped ${n(e.from)}'s ${it.name.toLowerCase()}!` }[e.blocked] || '';
  if (it.kind === 'gift') return `${it.icon} ${n(e.from)} gave ${n(e.target)} ${/^[aeiou]/i.test(it.name) ? 'an' : 'a'} ${it.name.toLowerCase()}!`;
  return `${it.icon} ${n(e.from)} unleashed ${/^[aeiou]/i.test(it.name) ? 'an' : 'a'} ${it.name.toLowerCase()} on ${n(e.target)}!`;
}
function fxToasts() {
  const fxKey = e => `${e.kind}|${e.from}|${e.target || ''}|${e.at}`;
  // The first view after connecting or reloading is history: remember it silently, announce only what comes later.
  if (!S.fxSeeded) { for (const e of (S.room && S.room.effects) || []) S.seenFx.add(fxKey(e)); S.fxSeeded = true; return; }
  if (!S.catalog) return; // announced once the catalogue has loaded, on the next change
  for (const e of (S.room && S.room.effects) || []) {
    const key = fxKey(e);
    if (S.seenFx.has(key)) continue;
    S.seenFx.add(key);
    if (fxPaper(e)) continue; // a sabotage, blocked attack or big gift made the front page instead
    const t = fxText(e); if (t) toast(t.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&'));
  }
}
function closeFlags() { S.flagSheet = false; render(); }
const flagThumb = k => `<svg viewBox="0 0 40 30" aria-hidden="true">${k ? flagArt(k, 40, 30) : '<path d="M4 4 36 15 4 26Z" fill="var(--hibiscus)"/>'}</svg>`;
// Pirate is the visible teaser; the other easter eggs only surface when you search their words.
function flagItems() {
  const q = S.flagQuery.trim().toLowerCase();
  const hits = q.length >= 3 ? SECRET_FLAGS.filter(k => FLAG_EGGS[k][1].some(w => w.startsWith(q) || q.startsWith(w))) : [];
  const found = foundFlags(), fresh = hits.filter(k => !found.includes(k));
  if (fresh.length) { ls.set('pb_found', JSON.stringify([...found, ...fresh])); S.flagFound = FLAG_EGGS[fresh[0]][0]; }
  const secret = SECRET_FLAGS.filter(k => found.includes(k) || hits.includes(k));
  const eggs = hits.map(k => [k, FLAG_EGGS[k]]);
  const cs = Array.isArray(S.countries) ? S.countries.filter(c => !q || c.name.toLowerCase().includes(q) || c.code === q) : [];
  const provinceWords = ['landskap', 'province', 'sverige', 'sweden'];
  const provs = Object.entries(LANDSKAP).filter(([slug, [name]]) => !q || fold(name).includes(fold(q)) || provinceWords.some(w => w.startsWith(q) && q.length >= 3));
  const btn = ([k, name]) => `<button class="flagbtn" aria-pressed="${S.flag === k}" onclick="pickFlag('${k}')">${flagThumb(k)}<span>${esc(name)}</span></button>`;
  const head = t => `<p class="flaghead">${t}</p>`;
  const note = S.countries === null ? `<p class="muted small">Unrolling the flag locker…</p>`
    : S.countries === 'error' ? `<p class="muted small">The country flags can't be loaded right now.</p>`
    : !cs.length && q && !eggs.some(([, [, words]]) => words.some(w => w.startsWith(q) || q.startsWith(w))) ? `<p class="muted small">No flag matches "${esc(S.flagQuery)}".</p>` : '';
  return (S.flagFound ? `<p class="flagfound" role="status">🎉 Special flag found: ${esc(S.flagFound)}!</p>` : '')
    + head('Ship flags') + [['', 'Pennant'], ['pirate', FLAG_EGGS.pirate[0]]].map(btn).join('')
    + (secret.length ? head('Special flags found') + secret.map(k => btn([k, FLAG_EGGS[k][0]])).join('') : '')
    + (cs.length ? head('Countries and regions') + withStowaways(cs.map(c => [c.code, c.name]), q, found).map(btn).join('') : '')
    + (provs.length ? head("Sweden's provinces") + provs.map(([slug, [name]]) => btn(['ls-' + slug, name])).join('') : '')
    + (provs.length && !cs.length && note.includes('No flag') ? '' : note);
}
// Unfound secret flags stow away among the countries at random spots (only while browsing, not searching).
function withStowaways(items, q, found) {
  if (q || !S.secretSpots) return items;
  const out = items.slice();
  SECRET_FLAGS.filter(k => !found.includes(k)).sort((a, b) => S.secretSpots[b] - S.secretSpots[a])
    .forEach(k => out.splice(Math.floor(S.secretSpots[k] * out.length), 0, [k, FLAG_EGGS[k][0]]));
  return out;
}
function fillFlags() { S.flagFound = ''; const el = document.getElementById('flaglist'); if (el) el.innerHTML = flagItems(); }
function flagSheetView() {
  if (!S.flagSheet) return '';
  return `<div class="sheet-bg" onclick="if(event.target===this)closeFlags()"><div class="sheet" role="dialog" aria-label="Choose your ship's flag">
    <div class="topbar"><h2>Raise your flag</h2><button class="link" onclick="closeFlags()">Done</button></div>
    <input id="flagq" class="text" type="search" placeholder="Search flags: Sweden, se…" value="${esc(S.flagQuery)}" oninput="S.flagQuery=this.value;fillFlags()" autocomplete="off">
    <div class="flaggrid" id="flaglist">${flagItems()}</div>
    <details class="credits"><summary>Flag credits</summary><p class="small">Country flags: flag-icons (MIT). Province flags and banners of arms from Wikimedia Commons:</p>
    <ul class="small">${Object.values(LANDSKAP).map(([name, , author, licence, src]) => `<li>${esc(name)}: <a href="${esc(src)}" target="_blank" rel="noopener">${esc(author)}</a>, ${esc(licence)}</li>`).join('')}</ul></details></div></div>`;
}
function pickFlag(k) {
  S.flag = flagOf(k); ls.set('pb_flag', S.flag);
  if (SECRET_FLAGS.includes(S.flag) && !foundFlags().includes(S.flag)) { // spotted a stowaway
    ls.set('pb_found', JSON.stringify([...foundFlags(), S.flag]));
    toast(`🎉 Special flag found: ${FLAG_EGGS[S.flag][0]}!`);
  }
  if (S.code) api('join', { code: S.code, nick: S.nick, ...joinLook() }).catch(() => {}); // opponents see it too
  S.flagSheet = false; // tapping a flag is the choice; no Done needed
  render();
  if (FLAG_EGGS[S.flag]) document.querySelectorAll('.harbor .scene, .myship .scene').forEach(el => { el.classList.add('wiggle'); setTimeout(() => el.classList.remove('wiggle'), 1300); });
}
// iOS Safari can still zoom on a quick second tap despite touch-action, so swallow that tap's zoom
// and deliver it as a plain click instead. Typing fields and the scratchpad are left alone.
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now(), quick = now - lastTouchEnd < 350;
  lastTouchEnd = now;
  if (!quick || e.touches.length || e.target.closest('input,textarea,select,canvas')) return;
  e.preventDefault();
  const hit = e.target.closest('button,a,label,summary,[onclick],[role="radio"]');
  if (hit) hit.click(); else e.target.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
}, { passive: false });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'bid') lockBid();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('aim')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && paperEl) { closePaper(); return; }
  if (e.key === 'Escape') { if (S.flagSheet) closeFlags(); else if (S.shopSheet) closeShop(); else if (S.targeting) { S.targeting = null; render(); } else if (S.sheetFor != null) closeSheet(); }
});

// #og-card: the 1200×630 social preview, drawn from the game's own artwork.
// Regenerate assets/og.png with the server running:
//   "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --window-size=1200,630 \
//     --virtual-time-budget=3000 --screenshot=assets/og.png "http://localhost:8080/#og-card"
function ogCard() {
  document.body.classList.add('og');
  // The scene is 1100px wide (scale 1100/360) from x=120; the full-width sea behind it uses the same scale,
  // levels and wave phase so the two meet without a seam.
  const k = 1100 / 360, top = 630 + 40 - 196 * k;
  const sea = `<svg class="og-sea" viewBox="0 0 ${(1200 / k).toFixed(2)} ${(630 / k).toFixed(2)}" aria-hidden="true"><g transform="translate(${(120 / k % 30 - 30).toFixed(2)} 0)">
    ${waves(top / k + 146, 1200 / k + 30, 630 / k, 'sh-sea2')}${waves(top / k + 156, 1200 / k + 30, 630 / k, 'sh-sea sh-wave')}</g></svg>`;
  return `<div class="ogcard">${sea}<div class="og-text"><h1>Puerto<br>Banana</h1><p>Bid blind for banana cargo with your friends. First to 200 wins.</p></div>
    ${heroScene(1.15, 'og-card', { hull: 'coral', cabin: 'white', flag: 'pirate' })}</div>`;
}
S.nick = ls.get('pb_nick') || '';
S.hull = HULLS[ls.get('pb_hull')] ? ls.get('pb_hull') : 'navy';
S.flag = flagOf(ls.get('pb_flag'));
function pickHull(k) { S.hull = k; ls.set('pb_hull', k); render(); }
S.cabin = CABINS[ls.get('pb_cabin')] ? ls.get('pb_cabin') : 'white';
function pickCabin(k) { S.cabin = k; ls.set('pb_cabin', k); render(); }
S.shopOn = ls.get('pb_shop') !== 'off';
async function loadCatalog() { try { S.catalog = (await (await fetch('/api/shop')).json()); } catch (e) { S.catalog = null; } }
loadCatalog();
if (location.hash === '#og-card') app.innerHTML = ogCard(); else {
render();
loadScores();
loadRivals();
}
// Some apps glue the share text onto the link (?join=RZLG Join my…): the code is the first four letters.
const invited = ((new URLSearchParams(location.search).get('join') || '').match(/^[a-z]{4}(?![a-z])/i) || [''])[0].toUpperCase();
if (/^[A-Z]{4}$/.test(invited)) { S.joinCode = S.invited = invited; history.replaceState(null, '', location.pathname); render(); } // from a shared invite link
const saved = ls.get('pb_code'); if (saved && !S.joinCode && location.hash !== '#og-card') enterRoom(saved, true);
</script>
