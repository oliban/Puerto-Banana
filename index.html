<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puerto Banana</title>
<!-- Social preview: the server fills in %%ORIGIN%%, %%URL%%, %%TITLE%% and %%DESC%% per request -->
<meta name="description" content="%%DESC%%">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Puerto Banana">
<meta property="og:title" content="%%TITLE%%">
<meta property="og:description" content="%%DESC%%">
<meta property="og:url" content="%%URL%%">
<meta property="og:image" content="%%ORIGIN%%/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A banana cargo ship sailing in a sunny Caribbean bay">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0582B8">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
/* Visual QA checklist (check after any layout change):
   - 320px and 390px wide: no horizontal scroll, rows wrap, title fits
   - safe-area insets on notched phones (top/bottom/left/right padding on #app and .sheet)
   - every tap target >= 44px tall, :focus-visible ring on every control
   - light + dark, and prefers-reduced-motion (ships stop bobbing, waves stop, reveal stops flipping)
   - cargo ships at fill 0, 0.5, 1 and >1 read as empty / half / full / overfull */
:root{
  --bg:#FFF8EC; --bg-2:#DDF7F6; --surface:#FFFFFF; --ink:#0B3954; --muted:#4D6F80; --line:#D3ECEA;
  --banana:#FFD60A; --banana-ink:#3A2F00; --banana-edge:#E5A100;
  --coral:#D93842; --ok:#078A7E;
  --sea:#3FD0E0; --sea-deep:#0582B8; --sky:#A6ECF5; --sky-2:#E9FCFF;
  --hull:#1D4E89; --keel:#FF6B6B; --rail:#1D4E89; --cabin:#FFFFFF;
  --mango:#FF9F1C; --hibiscus:#FF3E8A; --palm:#2BB673; --trunk:#9C6B3C; --sand:#FFE0A3; --sun:#FFC93C; --cloud:#FFFFFF; --smoke-dark:#5F6873; --smoke-light:#F4F7F9;
 
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071F2E; --bg-2:#0B3346; --surface:#0E3448; --ink:#EAFBFF; --muted:#9CC7D4; --line:#1B4A60;
    --banana-ink:#2A2200; --banana-edge:#C98E00; --coral:#FF7A7F; --ok:#3ED6C2;
    --sea:#0F7C99; --sea-deep:#06506E; --sky:#12425C; --sky-2:#0A2A3E;
    --hull:#2A64A8; --keel:#E85A5A; --rail:#7FB4E8; --cabin:#DCEFF5;
    --palm:#23A866; --trunk:#B88553; --sand:#C9A66B; --sun:#FFF0B8; --cloud:#2B5A73; --smoke-dark:#7F8A95; --smoke-light:#CBD6DD;

  }
}
:root[data-theme="dark"]{
  --bg:#071F2E; --bg-2:#0B3346; --surface:#0E3448; --ink:#EAFBFF; --muted:#9CC7D4; --line:#1B4A60;
  --banana-ink:#2A2200; --banana-edge:#C98E00; --coral:#FF7A7F; --ok:#3ED6C2;
  --sea:#0F7C99; --sea-deep:#06506E; --sky:#12425C; --sky-2:#0A2A3E;
  --hull:#2A64A8; --keel:#E85A5A; --rail:#7FB4E8; --cabin:#DCEFF5;
  --palm:#23A866; --trunk:#B88553; --sand:#C9A66B; --sun:#FFF0B8; --cloud:#2B5A73; --smoke-dark:#7F8A95; --smoke-light:#CBD6DD;

}
/* No double-tap zoom anywhere (quick taps on bids and sheets kept zooming by mistake); pinch zoom still works.
   Set on every element, SVG included: iOS Safari doesn't reliably take it from html/body. */
*,*::before,*::after{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;min-height:100%}
body{background:var(--bg) linear-gradient(var(--bg-2),var(--bg) 480px) no-repeat;color:var(--ink);font:400 17px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:460px;margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1,h2,.num{font-family:Bungee,Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.01em}
h2{font-size:1.25rem;margin:0 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:10px 18px;min-height:48px;font-weight:800;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--sea),0 3px 0 var(--line);touch-action:manipulation}
button.primary{background:linear-gradient(var(--banana),color-mix(in srgb,var(--banana) 80%,var(--mango)));color:var(--banana-ink);box-shadow:0 4px 0 var(--banana-edge)}
button.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--banana-edge)}
button:disabled{opacity:.45;cursor:default}
button.link{background:none;box-shadow:none;padding:0 4px;min-height:44px;color:var(--muted);font-weight:600;text-decoration:underline;text-align:left}
.wide{width:100%}
:focus-visible{outline:3px solid var(--hibiscus);outline-offset:2px}
input.text{width:100%;min-height:48px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
input.text:focus{border-color:var(--sea)}
input.code{text-transform:uppercase;font-family:Bungee,sans-serif;letter-spacing:.2em;min-width:0}
label,.label{display:block;font-weight:600;margin:0 0 6px}
.swatches{display:grid;grid-template-columns:repeat(var(--cols,4),44px);gap:var(--gap,8px)}
.swatch{min-height:44px;width:44px;padding:0;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 0 0 1px var(--line)}
.custom summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center;gap:6px;list-style:none}
.custom summary::-webkit-details-marker{display:none}
.custom summary::before{content:'▸';display:inline-block;transition:transform .2s}
.custom[open] summary::before{transform:rotate(90deg)}
.custom[open]>div{margin-top:8px}
.fruit-hint{margin:-2px 0 8px}
.sheet-cargo{display:flex;align-items:baseline;gap:8px;margin:-4px 0 12px;padding:8px 12px;border-radius:12px;background:var(--sea-deep,#1D4E89);color:#fff;font-weight:700}
.sheet-cargo .num{font:400 22px Bungee,sans-serif}
.fruits{display:grid;grid-template-columns:repeat(9,minmax(0,40px));gap:4px;justify-content:space-between}
.fruit{width:100%;min-height:0;aspect-ratio:1;padding:0;border-radius:50%;font-size:min(22px,5.6vw);line-height:1;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.fruit svg{width:62%;height:62%}
.fruit[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.swatch[aria-checked="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 140px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:0 3px 0 var(--line)}
.divider{height:4px;margin:24px 0;background:radial-gradient(circle,var(--sea) 1.6px,transparent 2.2px) 0 0/12px 4px repeat-x}
.err{color:var(--coral);font-weight:600}
/* Social preview card (#og-card), screenshotted at 1200×630 into assets/og.png */
body.og{overflow:hidden;background:linear-gradient(#E9FCFF,#A6ECF5 62%)}
body.og #app{max-width:none;padding:0}
.ogcard{position:relative;width:1200px;height:630px;overflow:hidden}
.ogcard .scene{position:absolute;left:120px;bottom:-40px;width:1100px}
.og-sea{position:absolute;inset:0;width:1200px;height:630px}
body.og .puff{display:none} /* smoke would drift over the tagline */
.og-text{position:absolute;left:56px;top:48px;z-index:1;color:#0B3954}
.og-text h1{margin:0;font-size:104px;line-height:.95;text-shadow:5px 5px 0 #FFD60A,9px 9px 0 #FF9F1C}
.og-text p{margin:22px 0 0;max-width:300px;font-size:30px;font-weight:800;line-height:1.25}
/* Shop */
.switch{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.switch input{width:22px;height:22px;accent-color:var(--sea-deep)}
.coins{font-family:Bungee,sans-serif;font-size:1.2rem}
.shopbtn{background:var(--banana);color:var(--banana-ink);box-shadow:0 3px 0 var(--banana-edge)}
.shoptabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.shoptabs button{flex:0 0 auto;padding:8px 12px;min-height:44px;font-size:.9rem}
.shoptabs button[aria-selected="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shopgrid>p{grid-column:1/-1}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;min-height:96px;font-size:.85rem;text-align:center}
.shopitem .icon{font-size:1.9rem;line-height:1}
.shopitem.poor{opacity:.45}
.aimbar{position:sticky;top:0;z-index:5;margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--hibiscus);color:#fff;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.aimbar .link{color:#fff}
.players li.aim{cursor:pointer;border-radius:12px;padding-left:8px;padding-right:8px;box-shadow:inset 0 0 0 3px var(--hibiscus);animation:aimpulse 1s ease-in-out infinite}
@keyframes aimpulse{50%{box-shadow:inset 0 0 0 3px transparent}}
/* Lobby invite: the code is the thing to share, so it reads like a boarding ticket */
.invite{margin:4px 0 16px;padding:16px;border-radius:18px;text-align:center;background:var(--banana);color:var(--banana-ink);box-shadow:0 4px 0 var(--banana-edge)}
.invite-label{display:block;font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.invite-code{display:block;width:100%;background:none;box-shadow:none;min-height:0;padding:0;color:inherit;cursor:copy;font-family:Bungee,Impact,sans-serif;font-size:clamp(3rem,18vw,4.4rem);letter-spacing:.18em;line-height:1.1;margin:4px 0 2px;padding-left:.18em}
.invite p{margin:0 0 12px}
.invite-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.invite .share{background:var(--surface);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);padding:10px 8px}
.invite .copied{margin:10px 0 0;font-weight:700}
.reconnecting{margin:-4px 0 12px;padding:8px 12px;border-radius:12px;background:var(--banana);color:var(--banana-ink);font-weight:800;text-align:center}
.waiting{text-align:center;font-weight:700;color:var(--muted);padding:12px 0;margin:0}
.dots i{font-style:normal;animation:dot 1.4s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:.88rem;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.topbar .code{font-family:Bungee,sans-serif;letter-spacing:.15em}

/* Cargo ships: one SVG drawing (shipSVG) loaded from an empty hold to bananas spilling overboard */
.shipsvg,.scene{display:block;width:100%;height:auto}
.tile{display:block;border-radius:12px;overflow:hidden;background:linear-gradient(var(--sky-2),var(--sky))}
.sh-hull{fill:var(--hull)} .sh-keel{fill:var(--keel)} .sh-stripe{stroke:#fff;stroke-width:2.5}
.sh-cabin{fill:var(--cabin)} .sh-win{fill:var(--sea-deep)} .sh-funnel{fill:var(--mango)} .sh-band{fill:var(--hibiscus)}
.sh-port{fill:#fff;opacity:.85} .sh-flag{fill:var(--hibiscus)}
.sh-mast{stroke:var(--rail);stroke-width:2.2;stroke-linecap:round;fill:none}
.sh-sea{fill:var(--sea-deep)} .sh-sea2{fill:var(--sea)}
.nb{fill:var(--banana);stroke:var(--banana-edge);stroke-width:.9;stroke-linejoin:round} .nb-tip{stroke:#5B4214;stroke-width:1.6;stroke-linecap:round}
.hs-sun{fill:var(--sun)} .hs-glow{fill:var(--sun);opacity:.25} .hs-cloud{fill:var(--cloud);opacity:.9}
.hs-bird{stroke:var(--ink);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.hs-sand{fill:var(--sand)} .hs-trunk{stroke:var(--trunk);stroke-width:5;fill:none;stroke-linecap:round} .hs-palm{fill:var(--palm)} .hs-nut{fill:var(--trunk)}
.sh-bob{animation:bob 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sh-wave{animation:drift 5s linear infinite}
.sh-float{animation:float 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.still .sh-bob,.still .sh-wave,.still .sh-float{animation:none}
/* Funnel smoke: each puff grows, lightens and drifts back over the stern; timings are per ship (see shipBody) */
.puff{filter:url(#smokeblur);transform-box:fill-box;transform-origin:center;opacity:0;animation:puff var(--t) cubic-bezier(.3,.6,.5,1) var(--d) infinite}
@keyframes puff{0%{fill:var(--smoke-dark);opacity:0;transform:translate(0,0) scale(1)}
  8%{opacity:var(--o)}
  50%{opacity:calc(var(--o) * .75);transform:translate(calc(var(--dx) * .35),calc(var(--dy) * .6)) scale(calc(var(--s) * .6))}
  100%{fill:var(--smoke-light);opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--s))}}
.still .puff{display:none}
/* Ship effects (shop): drawn in shipBody; purely decorative, so they never catch taps (the flag stays tappable).
   One-shot animations start --age seconds in (set per effect from when this browser first drew it), so a re-render
   resumes them, and once they're over the settled end state shows instead of replaying. */
.fxl{pointer-events:none}
@keyframes fxpop{from{opacity:0;transform:scale(.3)}}
.flame{fill:#FF9F1C;transform-box:fill-box;transform-origin:50% 100%;animation:flicker .5s ease-in-out infinite alternate}
@keyframes flicker{to{transform:scaleY(1.25) skewX(4deg);fill:#FFD60A}}
.puff.burnt{--smoke-dark:#111;--smoke-light:#4a4a4a}
.puff.rainbow{filter:none}
.smoketint{display:none}
.still .smoketint{display:inline}
.tent{transform-box:fill-box;transform-origin:50% 100%;animation:tentacle 1.6s ease-in-out infinite alternate}
@keyframes tentacle{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
.tent-edge{fill:none;stroke:#3E1652;stroke-width:14;stroke-linecap:round}
.tent-arm{fill:none;stroke:#9B4FC4;stroke-width:11;stroke-linecap:round}
.tent-sucker{fill:none;stroke:#F0D4FA;stroke-width:3.6;stroke-linecap:round;stroke-dasharray:0 8}
.sh-bob.rocked{animation:rock 1.1s ease-in-out infinite}
@keyframes rock{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.raincloud ellipse{fill:#5B6675}
.drip{stroke:#9CC7E8;stroke-width:2;stroke-linecap:round;animation:drip .6s linear infinite}
@keyframes drip{from{transform:translateY(-4px);opacity:1}to{transform:translateY(14px);opacity:0}}
.gw{fill:#fff;stroke:#4A5868;stroke-width:1.1;stroke-linejoin:round} .gt{fill:#2E3A46}
.gullraid{animation:gullraid 4.5s ease-in-out infinite}
@keyframes gullraid{0%{transform:translate(50px,-50px);opacity:0}15%{opacity:1}30%,45%{transform:translate(0,0)}85%{opacity:1}100%{transform:translate(-110px,-80px);opacity:0}}
.sharkswim{transform-box:fill-box;transform-origin:center;animation:swim 7s linear infinite}
@keyframes swim{0%{transform:translateX(-10px) scaleX(1)}46%{transform:translateX(160px) scaleX(1)}50%{transform:translateX(160px) scaleX(-1)}96%{transform:translateX(-10px) scaleX(-1)}100%{transform:translateX(-10px) scaleX(1)}}
.wake{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;opacity:.9}
.blk{animation:blk 4s linear both}
@keyframes blk{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
.jet{fill:none;stroke:#5CC0F0;stroke-width:6;stroke-linecap:round;stroke-dasharray:10 6;animation:jet .5s linear infinite}
@keyframes jet{to{stroke-dashoffset:-16}}
.soot{fill:#4a4a4a;opacity:0;transform-box:fill-box;transform-origin:center;animation:soot 1.2s ease-out infinite}
@keyframes soot{0%{opacity:.85;transform:scale(.4)}100%{opacity:0;transform:translate(-6px,-14px) scale(1.7)}}
.umbrella{transform-box:fill-box;transform-origin:50% 100%;animation:umbrella 4s ease-out both}
@keyframes umbrella{0%{opacity:0;transform:scale(.3)}10%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.bub{fill:rgba(160,220,255,.22);stroke:#9EDCF5;stroke-width:2.5} .bubshine{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.8}
.bubblepop{transform-box:fill-box;transform-origin:center;animation:bubble 4s ease-out both}
@keyframes bubble{0%{opacity:0;transform:scale(.2)}12%{opacity:1;transform:scale(1)}88%{opacity:1;transform:scale(1)}94%{opacity:.7;transform:scale(1.12)}100%{opacity:0;transform:scale(1.3)}}
.giftpop{transform-box:fill-box;transform-origin:50% 100%;animation:fxpop .5s ease-out both}
.candle{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .4s ease-in-out infinite alternate}
.petal{animation:petal 3s ease-in infinite}
@keyframes petal{from{transform:translateY(0);opacity:1}to{transform:translate(-20px,46px);opacity:0}}
.bottlebob{transform-box:fill-box;transform-origin:center;animation:bottle 1.8s ease-in-out infinite alternate}
@keyframes bottle{from{transform:translateY(1px) rotate(-8deg)}to{transform:translateY(-4px) rotate(8deg)}}
.teddywave{transform-box:fill-box;transform-origin:50% 100%;animation:wave 1.2s ease-in-out infinite alternate}
@keyframes wave{to{transform:rotate(-12deg)}}
.confetti{opacity:0;animation:confetti 1.4s ease-out both}
@keyframes confetti{from{opacity:1}to{transform:translate(var(--x),-36px) rotate(160deg);opacity:0}}
.minifw{opacity:0;transform-box:fill-box;transform-origin:center;animation:minifw 2.2s ease-out infinite}
@keyframes minifw{0%{opacity:0;transform:scale(.3)}15%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.sparkle{transform-box:fill-box;transform-origin:center;animation:sparkle 1.4s ease-in-out infinite}
@keyframes sparkle{50%{transform:scale(.3) rotate(45deg);opacity:.3}}
.glint{animation:glint 2.4s ease-in-out infinite}
@keyframes glint{0%,60%,100%{opacity:0}75%{opacity:1}}
.disco{fill:var(--c);stroke:#fff;stroke-width:1;animation:disco .8s ease-in-out infinite alternate}
@keyframes disco{to{opacity:.3}}
.discorays{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.parrotbob{transform-box:fill-box;transform-origin:50% 100%;animation:wave 2s ease-in-out infinite alternate}
.emote{transform-box:fill-box;transform-origin:50% 100%;animation:fxpop .3s ease-out both}
/* After the shorthands above, so it wins: per-item stagger (--d) minus the effect's age */
.fxl *{animation-delay:calc(var(--d,0s) - var(--age,0s))}
/* Sun: a breathing glow and warm rings rippling outward */
.hs-glow{transform-box:fill-box;transform-origin:center;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.38}}
.hs-heat{fill:none;stroke:var(--sun);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:heat 4.5s ease-out infinite}
@keyframes heat{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.1);opacity:0;stroke-width:1}}
/* Night mode swaps the sun for a crescent moon and a few twinkling stars */
.hs-night{display:none}
.hs-moon{fill:#FFF3C4} .hs-crater{fill:#E9D9A0} .hs-moonglow{fill:#FFF3C4;opacity:.12}
.hs-star{fill:#FFF8DC;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hs-day{display:none}:root:not([data-theme="light"]) .hs-night{display:inline}}
:root[data-theme="dark"] .hs-day{display:none} :root[data-theme="dark"] .hs-night{display:inline}
/* Birds: a slight downwind glide; wings beat via SMIL in bird() */
.hs-birdfly{animation:glide 9s ease-in-out infinite}
@keyframes glide{50%{transform:translate(-7px,-2px)}}
/* Palm sways in the same wind as the flags: leaning downwind (left, astern), fronds moving more than the trunk */
.hs-sway{transform-box:view-box;transform-origin:336px 148px;animation:sway 2.6s ease-in-out infinite}
.hs-crown{transform-box:view-box;transform-origin:318px 92px;animation:crown 2.6s ease-in-out -.4s infinite}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(-3.5deg)}}
@keyframes crown{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg) scaleX(.97)}}
/* Ship flags: a gentle wave on moving ships; the invisible tap target on your own ship opens the picker */
.sh-wave-flag{transform-box:fill-box;transform-origin:left center;animation:flagwave 2.6s ease-in-out infinite}
@keyframes flagwave{50%{transform:skewY(5deg) scaleX(.92)}}
.still .sh-wave-flag{animation:none}
.flag-hit{fill:transparent;cursor:pointer;pointer-events:all}
.flaggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.flagbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:80px;padding:8px 4px;font-size:.78rem;font-weight:600;line-height:1.2;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.flagbtn img,.flagbtn svg{width:44px;height:33px;border-radius:3px;box-shadow:0 0 0 1px var(--line);object-fit:cover}
.flagbtn span{overflow:hidden;text-overflow:ellipsis;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.flagbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
.flaggrid>p{grid-column:1/-1}
.toast{max-width:calc(100vw - 32px);width:max-content;text-align:center;position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;margin:0;padding:10px 16px;border-radius:14px;background:var(--banana);color:var(--banana-ink);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:pop .3s ease-out both}
.flagfound{grid-column:1/-1;margin:4px 0 0;padding:8px 12px;border-radius:12px;background:var(--banana);color:var(--banana-ink);font-weight:800;text-align:center;animation:pop .3s ease-out both}
.flaghead{margin:8px 0 0;font-weight:800;font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.credits{margin-top:14px}.credits ul{padding-left:18px;margin:6px 0 0}.credits a{color:inherit}
.wiggle{animation:wiggle 1.2s ease-in-out}
@keyframes wiggle{20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1.5deg)}80%{transform:rotate(1deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1.5px) rotate(-.8deg)}}
@keyframes drift{to{transform:translateX(-30px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(8deg)}}

/* Home: a Caribbean bay */
.harbor{border-radius:24px;overflow:hidden;background:linear-gradient(var(--sky-2),var(--sky) 70%);margin-bottom:18px;box-shadow:0 4px 0 var(--line)}
.harbor h1{margin:0;padding:18px 16px 0;text-align:center;color:var(--ink);font-size:clamp(1.6rem,8.6vw,2.4rem);line-height:1.05;text-shadow:3px 3px 0 var(--banana),5px 5px 0 var(--mango)}
.harbor-foot{background:var(--sea-deep);color:#fff;margin:-1px 0 0;padding:2px 16px 16px;font-size:.95rem}

/* The pot: the ship up for auction */
.potcard{border-radius:20px;background:var(--sea-deep);color:#fff;padding:12px 18px 14px;box-shadow:0 4px 0 var(--line)}
.plate{display:inline-block;background:var(--hibiscus);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem}
.potcard .num{font-size:clamp(2.6rem,14vw,3.6rem);line-height:1;margin-top:6px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.potcard .sub{font-weight:600;opacity:.95}
/* Your own ship: the big animated bay; opponents get small stills in the list */
.myship{margin-top:12px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--sky-2),var(--sky) 70%);box-shadow:0 4px 0 var(--line)}
/* While you bid, the pot rides on your ship's sky as a badge so the pad and Lock in fit on a phone screen */
.myship.withpot{position:relative}
.potbadge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:8px;background:var(--sea-deep);color:#fff;border-radius:999px;padding:4px 14px 4px 4px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.potbadge .num{font-size:1.5rem;line-height:1}
.potbadge .sub{font-size:.85rem;font-weight:600}
.myship-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--sea-deep);color:#fff;margin-top:-1px;padding:2px 16px 12px;line-height:1.25}
.myship-foot .num{font-size:1.9rem;line-height:1}
.players{list-style:none;margin:0;padding:0}
.players li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"ship name inv" "ship status inv";gap:0 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.players li:last-child{border-bottom:0}
.players.fit5 li{grid-template-columns:60px minmax(0,1fr) auto;padding:7px 0}
.players.fit6 li{grid-template-columns:52px minmax(0,1fr) auto;padding:5px 0}
.players.fit5 .name,.players.fit6 .name{line-height:1.2}
.players.fit5 .status,.players.fit6 .status{line-height:1.2}
.players.fit6 .name{font-size:.95rem}
.players.fit6 .status{font-size:.8rem}
.players .tile,.players .tilebox{grid-area:ship}
.tilebox{position:relative;display:block}
.flagbadge{position:absolute;right:-5px;top:-5px;width:24px;height:18px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 1px 3px rgba(0,0,0,.35);pointer-events:none}
.flagbadge svg{display:block;width:100%;height:100%}
.players li.me .name{color:var(--coral)}
.players .name{grid-area:name;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:end}
.players .inv{grid-area:inv;font-family:Bungee,sans-serif;font-size:1.15rem;text-align:right}
.players .status{grid-area:status;font-size:.88rem;color:var(--muted);align-self:start}
.players .status.ok{color:var(--ok);font-weight:600}
.players .status.taunt{color:var(--coral);font-style:italic;font-weight:600}
/* Your own taunt, big, with the flag that earned it */
.taunt-me{margin-top:14px}
.taunt-me .bongo-says .bubble{box-shadow:inset 0 0 0 3px var(--coral),0 3px 0 var(--line)}
.taunt-me .bubble>svg{width:30px;height:22px;vertical-align:-5px;margin-right:6px;border-radius:2px}
/* Captain Bongo and his speech bubble */
.bongo-says{display:flex;align-items:flex-end;gap:6px;margin:4px 0 14px}
.bongo-says .bubble{position:relative;flex:1;min-width:0;background:var(--surface);border-radius:18px;padding:12px 14px;font-size:.95rem;line-height:1.45;box-shadow:0 3px 0 var(--line);margin-bottom:46px}
.bongo-says .bubble:after{content:"";position:absolute;right:-10px;bottom:20px;border:10px solid transparent;border-left-color:var(--surface);border-right:0}
.bongo-says .bubble p{margin:0 0 8px}.bongo-says .bubble p:last-child{margin:0}
.bubble-title{font-family:Bungee,Impact,sans-serif;font-size:1rem}
.bongo{flex:0 0 92px;width:92px;height:auto}
.bongo-bob{animation:bongobob 2.4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
@keyframes bongobob{50%{transform:translateY(-3px) rotate(-2deg)}}
.bongo-talk{transform-box:fill-box;transform-origin:center;animation:bongotalk .32s ease-in-out 10 alternate}
@keyframes bongotalk{to{transform:scaleY(.35)}}
.bidbox{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;align-items:stretch}
.bidbox button{font-size:1.6rem;padding:0}
.bidbox input{width:100%;min-width:0;text-align:center;font-family:Bungee,sans-serif;font-size:2.2rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:6px 0}
.bidbox input.unsure{border-color:var(--coral);color:var(--coral)}
/* Bid scratchpad (handwritten digits, read by digits.js) */
.pad{margin-bottom:10px;position:relative;background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.pad canvas{display:block;width:100%;height:160px;touch-action:none;cursor:crosshair}
.pad .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none;font-weight:600}
.pad .tools{position:absolute;top:6px;right:6px;display:flex;gap:6px}
.pad .tools button{min-height:36px;padding:4px 12px;font-size:.9rem}
.pad .unsure-note{position:absolute;left:12px;right:12px;bottom:6px;margin:0;pointer-events:none}
.topbar .right{display:flex;align-items:center;gap:12px}
.topbar .shopbtn{min-height:36px;padding:4px 12px;font-size:.9rem}
.sheet-bg{position:fixed;inset:0;background:rgba(4,30,45,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;border-top:6px solid var(--sea);
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
/* The results sheet's button stays pinned to the bottom, so Next round never needs a scroll */
.sheet-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:0 -16px calc(-20px - env(safe-area-inset-bottom,0px));padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -10px 12px -10px rgba(0,0,0,.4)}
.reveal{list-style:none;padding:0;margin:0 0 14px}
.reveal li{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--surface);margin-bottom:8px;animation:flip .45s both}
.reveal li .tile,.reveal li .tilebox{flex:0 0 60px}
.reveal li .who{flex:1;min-width:0}
.reveal li .num{font-size:1.5rem}
.reveal li.top{box-shadow:inset 0 0 0 3px var(--banana)}
.delta{font-weight:800}
.delta.up{color:var(--ok)} .delta.down{color:var(--coral)}
.reveal li .who{display:flex;flex-direction:column}
.reveal li .bid{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.winner{text-align:center;padding:0 0 16px;overflow:hidden}
.winner .tile{border-radius:0;margin-bottom:12px}
.winner .tile .shipsvg{max-width:320px;margin:0 auto}
.winner .num{font-size:clamp(1.8rem,9vw,2.6rem);color:var(--coral);overflow-wrap:anywhere;padding:0 12px}
details{margin-top:18px}
summary{cursor:pointer;font-weight:600;color:var(--muted);min-height:44px;display:flex;align-items:center}
.earlier{margin-top:18px}
.earlier h3{margin:0 0 4px;font-size:1rem;font-weight:600;color:var(--muted)}
.hist{font-size:.92rem}
.hist div{padding:6px 0;border-bottom:1px solid var(--line)}
/* Harbour log: the shared top 20 */
.log h2{margin-bottom:4px}
.log ol{list-style:none;margin:10px 0 0;padding:0}
.log li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:baseline;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .rank{font-family:Bungee,sans-serif;color:var(--muted)}
.log li:nth-child(1) .rank{color:var(--mango)} .log li:nth-child(2) .rank{color:var(--sea-deep)} .log li:nth-child(3) .rank{color:var(--hibiscus)}
.log .who{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .when{grid-column:2;font-size:.82rem;color:var(--muted)}
.log .score{font-family:Bungee,sans-serif;font-size:1.1rem;grid-column:3;grid-row:1}
/* Rivals chart: win rate per captain, each line in its hull colour */
.rivals h2{margin-bottom:4px}
.rv-chart{display:block;width:100%;height:auto;margin:0 0 6px}
.rv-grid{stroke:var(--line);stroke-width:1}
.rv-tick{fill:var(--muted);font:600 11px Figtree,system-ui,sans-serif}
.rv-line path{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.rv-line circle{fill:var(--c);stroke:var(--surface);stroke-width:2}
.rv-me path{stroke-width:3.6}
.rv-faded{opacity:.15}
.rv-legend{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.rv-chip{width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;font-weight:600;text-align:left;box-shadow:inset 0 0 0 1px var(--line)}
.rv-chip[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
.rv-dot{width:12px;height:12px;border-radius:50%}
.rv-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-stat{font-size:.85rem;color:var(--muted);font-weight:600}
/* Victory show: banana rain, fireworks and (1 game in 5) torpedoes. Lives outside #app so re-renders keep it. */
#party{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
#party .drop{position:absolute;top:-8vh;left:var(--x);width:var(--w);animation:fall var(--t) linear var(--d) both}
@keyframes fall{from{transform:translateY(0) rotate(var(--r0))}to{transform:translateY(118vh) rotate(var(--r1))}}
#party .burst{position:absolute;left:var(--x);top:var(--y)}
#party .burst i{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);
  transform:rotate(var(--a)) translateX(0);opacity:0;animation:spark 1.1s cubic-bezier(.15,.7,.3,1) var(--d) both}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}70%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--len)) translateY(14px)}}
#party .battle{position:absolute;left:50%;top:22%;width:min(92vw,420px);transform:translateX(-50%);border-radius:20px;overflow:hidden;
  background:linear-gradient(var(--sky-2),var(--sky));box-shadow:0 10px 40px rgba(0,0,0,.35);animation:pop .3s ease-out both}
#party .battle p{margin:0;padding:8px 14px 12px;background:var(--sea-deep);color:#fff;font-weight:800;text-align:center}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.9)}}
.torp{animation:torp var(--t,1.4s) ease-in var(--d) both}
@keyframes torp{from{transform:translate(0,0);opacity:1}95%{opacity:1}to{transform:translate(var(--dx),0);opacity:0}}
.boom{transform-box:fill-box;transform-origin:center;animation:boom .9s ease-out var(--d) both}
@keyframes boom{from{transform:scale(0);opacity:1}to{transform:scale(1.6);opacity:0}}
.sinking{transform-box:fill-box;transform-origin:60% 100%;animation:sink var(--t,2.6s) ease-in var(--d) both}
@keyframes sink{from{transform:none}25%{transform:rotate(-12deg)}to{transform:translateY(90px) rotate(-30deg)}}
.bubble{animation:rise 1.4s ease-out var(--d) both}
@keyframes rise{from{transform:translateY(0);opacity:0}20%{opacity:.9}to{transform:translateY(-26px);opacity:0}}
.flotsam{animation:surface 1s ease-out var(--d) both}
@keyframes surface{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.storm{position:absolute;inset:0;overflow:hidden;pointer-events:auto;cursor:pointer;animation:stormfade 7.5s ease both}
@keyframes stormfade{0%{opacity:0}6%,88%{opacity:1}100%{opacity:0}}
.storm-tint{background:linear-gradient(#2C3644,#4A5868 55%,#26404F)!important}
.storm-ship{position:absolute;left:50%;top:50%;width:min(94vw,460px);transform:translate(-50%,-50%);text-align:center}
.storm-ship .scene{filter:saturate(.45) brightness(.8);animation:mourn 3s ease-in-out infinite;transform-origin:50% 80%}
.storm-ship .hs-day,.storm-ship .hs-night,.storm-ship .hs-birdfly{display:none}
@keyframes mourn{50%{transform:rotate(2.5deg) translateY(3px)}}
.storm-ship p{margin:14px 0 0;color:#E8EEF5;font-weight:800;font-size:1.1rem;line-height:1.35;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.storm-tint{position:absolute;inset:0}

.storm-flash{position:absolute;inset:0;background:#F4F8FF;opacity:0;animation:flash 7.5s linear both}
@keyframes flash{0%,17%{opacity:0}18%{opacity:.75}20%{opacity:0}21%{opacity:.45}23%,58%{opacity:0}59%{opacity:.6}61%,100%{opacity:0}}
.storm-clouds{position:absolute;top:-8px;left:0;width:100%;height:150px;fill:#3E4A5A;opacity:.95;animation:clouds 7.5s ease both}
@keyframes clouds{0%{transform:translateY(-120%)}12%,85%{transform:none}100%{transform:translateY(-120%)}}
.rainline{position:absolute;top:-6vh;left:var(--x);width:2px;height:22px;border-radius:1px;background:linear-gradient(transparent,rgba(214,230,255,.9));
  transform:rotate(14deg);animation:rainfall var(--t) linear var(--d) infinite}
@keyframes rainfall{to{transform:translate(-22vh,112vh) rotate(14deg)}}
.peel{opacity:.95}
.battle.focus p{background:#4A5566}
.party-banner{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:min(92vw,420px);background:var(--surface);color:var(--ink);
  border-radius:16px;padding:12px 16px;font-weight:800;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
/* World-politics easter eggs (GAGS in the script): purely visual. One-shot entrances start --age seconds in
   (from when this browser first drew that occurrence), so re-renders show them settled instead of replaying. */
.reveal li{position:relative;flex-wrap:wrap}
.gagrow{flex:1 0 100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:2px 2px 2px 4px;font-size:.86rem;line-height:1.35;font-weight:600;color:var(--ink)}
.gagline{animation:gagin .4s ease-out both;animation-delay:calc(.7s - var(--age,0s))}
@keyframes gagin{from{opacity:0;transform:translateY(-4px)}}
.gag-stamp{position:absolute;left:50%;top:50%;z-index:1;pointer-events:none;padding:1px 10px;border:3px solid var(--coral);border-radius:6px;color:var(--coral);
  background:color-mix(in srgb,var(--surface) 55%,transparent);font:400 clamp(1.1rem,6.4vw,1.55rem)/1.15 Bungee,Impact,"Arial Black",sans-serif;letter-spacing:.06em;white-space:nowrap;
  transform:translate(-50%,-50%) rotate(-12deg);animation:stampin .45s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.6s - var(--age,0s))}
@keyframes stampin{from{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4)}}
.gag-badge{display:inline-block;border:2px solid var(--coral);border-radius:5px;padding:0 6px;color:var(--coral);font:400 .78rem/1.5 Bungee,Impact,sans-serif;letter-spacing:.03em;transform:rotate(-3deg)}
.gag-badge s{text-decoration-thickness:2px}
.gag-paused{display:inline-block;margin-left:4px;padding:0 8px;border-radius:999px;background:var(--ok);color:var(--surface);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.gag-kp{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.gag-kp .num,.reveal li .gag-kp .num{font-size:1.45rem;color:var(--coral)}
.gag-kp small{font-size:.74rem;font-weight:400;color:var(--muted)}
.players li{grid-template-areas:"ship name inv" "ship status inv" ". gag gag"}
.players .gag{grid-area:gag;font-size:.8rem;line-height:1.3;color:var(--muted);font-weight:600;padding-top:2px}
.players .gag .gag-kp{color:var(--ink)}
.gag-euro{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:14px;padding:14px 16px;border-radius:18px;text-align:center;color:#fff;
  background:linear-gradient(135deg,#1B1464,#5B2A86 55%,#C2185B);box-shadow:0 3px 0 var(--line);animation:gagpop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.4s - var(--age,0s))}
.gag-euro .lbl{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.9;max-width:100%;overflow-wrap:anywhere}
.gag-euro .pts{font-family:Bungee,Impact,sans-serif;font-size:clamp(2.1rem,12vw,2.9rem);line-height:1.05;color:#FFD500;text-shadow:0 3px 0 #0057B7}
@keyframes gagpop{from{opacity:0;transform:scale(.6)}}
.gag-crown{transform-box:fill-box;transform-origin:50% 100%;animation:crowndrop 1.6s ease-out both}
@keyframes crowndrop{0%{transform:translateY(-70px) rotate(-20deg);opacity:0}10%{opacity:1}45%{transform:translateY(0) rotate(14deg)}60%{transform:rotate(-10deg)}75%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}100%{transform:none}}
.gag-bloom{transform-box:fill-box;transform-origin:50% 100%;animation:fxpop .6s cubic-bezier(.3,1.5,.5,1) both}
.gag-escort{animation:escortin 1.8s ease-out both}
@keyframes escortin{from{transform:translateX(70px);opacity:0}}
.gag-escortbob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}
.gag-canal{animation:canal 12s linear both;animation-delay:calc(.5s - var(--age,0s))}
@keyframes canal{from{transform:translateX(-330px)}to{transform:translateX(130px)}}
.torp.swerve{animation-name:swerve}
@keyframes swerve{0%{transform:translate(0,0);opacity:1}55%{transform:translate(calc(var(--dx) * .78),0)}70%{transform:translate(var(--dx),13px)}85%{transform:translate(calc(var(--dx) + 34px),13px);opacity:1}100%{transform:translate(calc(var(--dx) + 80px),4px);opacity:0}}
.gag-caption{transform-box:fill-box;transform-origin:50% 100%;animation:gagpop .4s ease-out var(--d) both}
/* The Banana Times: breaking-news front pages (showPaper in the script). Lives outside #app so re-renders keep it.
   The paper stays paper-coloured in dark mode on purpose. */
#bt{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:rgba(5,25,40,.55);backdrop-filter:blur(2px);padding:12px;cursor:pointer}

<script>
const GOAL = 200, MAX_PLAYERS = 6;
const S = { papers: new Set(), paperSeeded: false, gameSeq: 0, shopOn: true, shopSheet: null, shopTab: 'sabotage', targeting: null, catalog: null, seenFx: new Set(), fxSeeded: false, strokes: [], drawing: false, pendingRender: false, read: null, tauntBook: null, hull: 'navy', cabin: 'white', flag: '', flagSheet: false, flagQuery: '', countries: null, code: null, room: null, es: null, nick: '', joinCode: '', bidDraft: '', error: '', busy: false, sheetFor: null, seen: 0, scores: null, rivals: null, rivalHi: null };
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
function token() {
  let t = ls.get('pb_token');
  if (!t || !/^[a-f0-9]{32}$/.test(t)) { const a = new Uint8Array(16); crypto.getRandomValues(a); t = [...a].map(b => b.toString(16).padStart(2, '0')).join(''); ls.set('pb_token', t); }
  return t;
}
async function api(action, extra = {}) {
  const r = await fetch('/api', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, token: token(), code: S.code, ...extra }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong. Try again.');
  return d;
}
async function act(fn) { S.busy = true; S.error = ''; render(); try { await fn(); } catch (e) { S.error = e.message; } S.busy = false; render(); }

// ---------- harbour log (shared highscores) ----------
// S.scores: null = loading, array = loaded, 'error' = unavailable. Never blocks rooms.
async function loadScores() {
  try {
    const r = await fetch('/api/highscores');
    if (!r.ok) throw new Error();
    const d = await r.json();
    S.scores = Array.isArray(d) ? d : 'error';
  } catch (e) { S.scores = 'error'; }
  if (!S.code || !S.room) render();
}

// ---------- rivals chart (game history) ----------
// S.rivals: null = loading, object = loaded, 'error' = unavailable. Never blocks rooms.
// Only the newest request may land, so a slow answer for an older name never overwrites a newer one.
let rivalsSeq = 0;
async function loadRivals() {
  const seq = ++rivalsSeq;
  let next;
  try {
    const r = await fetch('/api/rivals?name=' + encodeURIComponent(S.nick.trim()));
    if (!r.ok) throw new Error();
    const d = await r.json();
    next = d && Array.isArray(d.players) ? d : 'error';
  } catch (e) { next = 'error'; }
  if (seq !== rivalsSeq) return;
  S.rivals = next;
  if (next === 'error' || !next.players.some(p => p.key === S.rivalHi)) S.rivalHi = null; // never leave every line faded
  if (!S.code || !S.room) render();
}
function toggleRival(i) { const k = S.rivals.players[i].key; S.rivalHi = S.rivalHi === k ? null : k; render(); }

// ---------- cargo ships ----------
// One ship drawing, loaded by fill: 0 = empty hold, 1 = full to the rails, >1 = piled high and spilling.
// The hold takes 28 bunches (about 7 bananas each); the hull also sinks with every banana, so the
// picture keeps changing from 0 to GOAL. Single bananas only ever float in the sea, never on deck.
// Ship coordinates are 220 wide with the waterline near y 92. The load sets how deep it sits: empty rides
// high on its red keel, at GOAL the rail is just above the water, overfull puts the deck awash.
const HOLD = { x: 66, cols: 7, rows: 4, w: 19, h: 9, deck: 51, bh: 11 };
const SLOTS = HOLD.cols * HOLD.rows;
const wob = i => (i * 37 % 13) - 6; // stable per-bunch tilt so piles look stacked by hand
const overflow = f => f > 1.03 ? Math.min(15, Math.max(2, Math.round((f - 1) * SLOTS))) : 0;
const cargoWord = f => f <= 0 ? 'Empty' : f < 0.1 ? 'A few bananas' : f < 0.25 ? 'Light load' : f < 0.4 ? 'Filling up' : f < 0.6 ? 'Half full'
  : f < 0.8 ? 'Well stocked' : f < 0.95 ? 'Nearly full' : overflow(f) ? (f < 1.3 ? 'Overfull' : 'Sinking with bananas') : 'Full';
// Each bunch is drawn bigger than its slot (same bottom edge), so neighbours and rows overlap into a packed pile.
const PACK = { w: 25, h: 17 };
const bunch = (x, y, i) => {
  const bx = x - (PACK.w - HOLD.w) / 2, by = y + HOLD.bh - PACK.h;
  return `<use href="#bunch" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${PACK.w}" height="${PACK.h}" transform="rotate(${wob(i)} ${(x + HOLD.w / 2).toFixed(1)} ${(y + HOLD.bh / 2).toFixed(1)})"/>`;
};
// The deck slopes up toward the bow (hull top runs from (6,52) to (212,45)). Each column is tucked the same
// depth (SINK) into the hull where it stands: loaded in the hold, yet the first row shows along the whole deck.
const deckAt = x => 52 - 7 * (x - 6) / 206, SINK = 3.5;
const slotX = i => HOLD.x + (i % HOLD.cols) * HOLD.w;
const slotY = i => deckAt(slotX(i) + HOLD.w / 2) + SINK - HOLD.bh - Math.floor(i / HOLD.cols) * HOLD.h;
function waves(y, width, bottom, cls) {
  let d = `M0 ${y}`;
  for (let x = 0; x < width + 30; x += 30) d += 'q7.5 -4 15 0t15 0';
  return `<path class="${cls}" d="${d}V${bottom}H0Z"/>`;
}
// Seeded randomness: each ship's floating bananas stay put across re-renders, and change when its load
// changes or the page reloads.
const SEA_SEED = (Math.random() * 2 ** 32) >>> 0;
function rng(key) {
  let h = SEA_SEED;
  for (const c of String(key)) h = Math.imul(h ^ c.charCodeAt(0), 2654435761);
  return () => { h = (h + 0x6D2B79F5) | 0; let t = Math.imul(h ^ (h >>> 15), 1 | h); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 2 ** 32; };
}

// Country flags come from the MIT-licensed flag-icons set on jsDelivr; easter eggs are drawn above in <defs>.
const FLAG_CDN = 'https://cdn.jsdelivr.net/npm/flag-icons@7.5.0/';
const FLAG_EGGS = { pirate: ['Jolly Roger', ['pirate', 'jolly', 'roger', 'skull']], banana: ['Banana Republic', ['banana']],
  rainbow: ['Rainbow', ['rainbow', 'pride']], chequered: ['Chequered', ['chequered', 'checkered', 'race', 'finish']],
  white: ['White flag', ['white', 'surrender']], bongo: ['Captain Bongo', ['bongo', 'monkey', 'mascot']],
  pineapple: ['Pineapple', ['pineapple', 'ananas']], parrot: ['Parrot', ['parrot', 'polly']],
  kraken: ['Kraken', ['kraken', 'octopus', 'squid']], pizza: ['Pizza', ['pizza']], unicorn: ['Unicorn', ['unicorn']],
  duck: ['Rubber duck', ['duck', 'rubber']], arcade: ['Space invader', ['arcade', 'invader', 'retro', 'safsten']] };
// Secret flags (every egg but the Jolly Roger teaser) show only once found by searching; found ones are remembered.
const SECRET_FLAGS = Object.keys(FLAG_EGGS).filter(k => k !== 'pirate');
const foundFlags = () => { try { return JSON.parse(ls.get('pb_found') || '[]').filter(k => SECRET_FLAGS.includes(k)); } catch (e) { return []; } };
const FLAG_EXTRAS = ['eu', 'un', 'gb-eng', 'gb-sct', 'gb-wls', 'gb-nir']; // non-country flags worth offering
// Swedish provinces (code "ls-<slug>"), files in assets/flags/se/ from Wikimedia Commons: [name, isCoatOfArms, author, licence, source]
const LANDSKAP = {
  blekinge: ['Blekinge', true, "Lokal_Profil", 'CC BY-SA 2.5', "https://commons.wikimedia.org/wiki/File:Blekinge_vapen.svg"],
  bohuslan: ['Bohuslän', false, "Kaiser Torikka", 'Public domain', "https://commons.wikimedia.org/wiki/File:Flag_of_Bohusl%C3%A4n.svg"],

  halland: ['Halland', true, "Lokal_Profil", 'CC BY-SA 2.5', "https://commons.wikimedia.org/wiki/File:Halland_vapen.svg"],

  harjedalen: ['Härjedalen', false, "Lokal_Profil", 'Public domain', "https://commons.wikimedia.org/wiki/File:Flag_of_H%C3%A4rjedalen.svg"],
  jamtland: ['Jämtland', true, "Marmelad", 'CC BY-SA 2.5', "https://commons.wikimedia.org/wiki/File:J%C3%A4mtland_vapen.svg"],

};
// Coats of arms become banners of arms: the shield's field cropped to the flag rectangle (outline and point trimmed).
const ARMS_CROP = '6 8 239 179';
const fold = t => t.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); // "Skåne" matches "skane"
const flagOf = f => typeof f !== 'string' ? '' : f.startsWith('ls-') ? (LANDSKAP[f.slice(3)] ? f : '')
  : FLAG_EGGS[f] || /^[a-z]{2}(-[a-z]{2,4})?$/.test(f) ? f : ''; // mirrors players.js
// The artwork for a (valid, non-empty) flag code, filling a w×h box.
function flagArt(flag, w, h) {

    const key = `${g}|${lr.round}|bust|${s.id}`;

const SAB_PAPER = {

  bomb: (t, f) => [`Bomb aboard ${t}'s ship`, `Smoke seen for miles. ${f} claims to have been “nowhere near it”.`],
  cloud: (t, f) => [`Rain cloud parks over ${t}`, `Forecast: soggy bananas. ${f} seen near a weather machine.`],
  shark: (t, f) => [`Shark circles ${t}`, `Swimmers told to stay ashore. ${f} spotted feeding it bananas.`],
  gulls: (t, f) => [`Gulls loot ${t}'s bananas`, `Police suspect ${f}. The gulls aren't talking.`],
};
const SAB_NAME = { kraken: 'kraken', bomb: 'bomb', cloud: 'rain cloud', shark: 'shark', gulls: 'seagull raid' };
const BLOCK_PAPER = {
  hose: (t, f) => [`Fire hose saves ${t}'s ship`, `${f}'s bomb fizzles out. Soot everywhere, bananas fine.`],
  umbrella: (t, f) => [`Umbrella foils rain cloud`, `${t} stays dry. ${f}'s weather plot is a washout.`],
  bubble: (t, f, k) => [`Bubble shield holds`, `${f}'s ${SAB_NAME[k] || 'attack'} bounces off ${t}'s ship.`],
};
const GIFT_PAPER = {
  diamond: (t, f) => [`Society pages`, `${f} showers ${t} with diamonds. Rumours swirl.`, `${t}'s ship, sparkling.`],
  fireworks: (t, f) => [`Society pages`, `${f} lights up the sky for ${t}. Neighbours complain; rumours swirl.`, `${t}'s ship, under a shower of sparks.`],
};
function fxStory(e, r = S.room) {
  if (!r || e.kind === 'emote' || !e.target) return null;
  const t = nm(e.target), f = nm(e.from), fill = Math.max(invOf(r, e.target), 1) / GOAL;
  const fx = (sab, blocked, gifts) => ({ fx: { sab, blocked, gifts, emote: null, age: { [blocked[0] || sab[0] || gifts[0]]: 0 } } });
  let h;
  if (e.blocked && BLOCK_PAPER[e.blocked]) {
    h = BLOCK_PAPER[e.blocked](t, f, e.kind);
    return { kind: 'blocked', headline: h[0], sub: h[1], caption: `${t}'s ship, untouched.`, photo: photoOf(r, e.target, fx([], [e.blocked], []), fill), round: e.round || undefined };
  }
  if (e.blocked) return null;
  if (SAB_PAPER[e.kind]) {
    const ally = gagStory(r, e.target, 'sabotaged', '', { from: f, item: SAB_NAME[e.kind] }, fx([e.kind], [], []));
    h = SAB_PAPER[e.kind](t, f);
    return { kind: 'sabotage', headline: ally ? ally.headline : h[0], sub: ally ? ally.sub : h[1], caption: ally ? ally.caption : `${t}'s ship, this morning.`,
      photo: photoOf(r, e.target, fx([e.kind], [], []), fill), round: e.round || undefined };
  }
  if (GIFT_PAPER[e.kind]) {
    h = GIFT_PAPER[e.kind](t, f);
    return { kind: 'gift', headline: h[0], sub: h[1], caption: h[2], photo: photoOf(r, e.target, fx([], [], [e.kind]), fill), round: e.round || undefined };
  }
  return null;
}
// Is the results sheet still flipping its rows in? Then wait (and come back when it's done).
function revealing(lr) {
  if (S.sheetFor !== lr.round) return false;
  const need = 0.12 * Math.max(0, S.room.order.length - 1) + 1.3, age = gagAge(`${S.room.code}|sheet|${lr.round}`);
  if (age >= need) return false;
  clearTimeout(S.paperWait); S.paperWait = setTimeout(paperPump, (need - age) * 1000 + 30);
  return true;
}
// Called from fxToasts for each new effect: true if it went out as a paper (then no toast).
function fxPaper(e) {
  const r = S.room;
  if (!r || S.code === 'DEMO' || paperEl || document.getElementById('party')) return false;
  if (r.lastResult && revealing(r.lastResult)) return false;
  const budget = `${paperGame(r)}|${e.round ?? 0}|mid`;
  if (S.papers.has(budget)) return false;
  const st = fxStory(e);
  if (!st) return false;
  S.papers.add(budget); showPaper(st);
  return true;
}
// Decide whether a paper is due now. Runs after every render, when a paper closes and when the victory show ends.
function paperPump() {
  clearTimeout(S.paperWait); S.paperWait = null;
  const r = S.room;
  if (!r || !S.code || S.code === 'DEMO') return;
  const g = paperGame(r), lr = r.lastResult;
  if (!S.paperSeeded) { // first view on this connection: what's already happened is old news
    if (lr) { S.papers.add(`${g}|${lr.round}|round`); for (const c of roundStories(r, lr, g)) S.papers.add(c.key); }
    if (r.status === 'over') S.papers.add(`${g}|gossip`);
    S.rematchFor = null; S.paperSeeded = true;
    return;
  }
  if (paperEl || document.getElementById('party')) return;
  if (S.rematchFor === g) {
    S.rematchFor = null;
    if (!S.papers.has(`${g}|rematch`)) { S.papers.add(`${g}|rematch`); showPaper(rematchStory(r)); return; }
  }
  if (lr && !S.papers.has(`${g}|${lr.round}|round`)) {
    const over = r.status === 'over';
    if (over ? S.sheetFor != null || S.celebrated !== celebKey(r) : revealing(lr)) return;
    const cands = roundStories(r, lr, g), pick = cands.find(c => !S.papers.has(c.key));
    S.papers.add(`${g}|${lr.round}|round`);
    for (const c of cands) if (!c.perGame) S.papers.add(c.key); // one per round: the rest stay as row stamps
    if (pick) { S.papers.add(pick.key); if (pick.kind === 'over') S.overShown = g; showPaper(pick); return; }
  }
  if (r.status === 'over' && S.overShown === g && S.tauntBook && !S.papers.has(`${g}|gossip`)) {
    S.papers.add(`${g}|gossip`);
    const st = gossipStory(r);
    if (st) showPaper(st);
  }
}

// Dev hook, console only (no UI): paperDemo(kind, arg) fakes an offline room and prints one front page.
// kinds: 'over', 'torpedo', 'bust', 'record', 'comeback', 'gossip', 'rematch', 'sabotage' (arg: bomb|kraken|cloud|shark|gulls),
// 'blocked' (arg: hose|umbrella|bubble), 'gift' (arg: diamond|fireworks), 'gag' (arg: any GAGS flag, e.g. 'ru', 'gb', 'ch'),
// 'leave' (the UK Leave paper). paperDemo('all') lists them. Leave or reload to exit.
const PAPER_KINDS = ['over', 'torpedo', 'bust', 'record', 'comeback', 'gossip', 'rematch', 'sabotage', 'blocked', 'gift', 'gag', 'leave'];
function paperDemo(kind = 'over', arg) {
  if (kind === 'all') return `paperDemo(kind, arg): ${PAPER_KINDS.join(', ')}. gag flags: ${Object.keys(GAGS).join(', ')}`;
  if (S.es) S.es.close();
  S.es = null; closePaper(true); document.getElementById('party')?.remove();
  const flag = kind === 'leave' ? 'gb' : kind === 'gag' ? flagOf(arg || 'ru') : '';
  const P = (id, nick, hull, f) => ({ id, nick, hull, cabin: 'white', flag: f, bling: [], locked: false });
  const players = [P('p1', S.nick || 'Bo', S.hull, flag), P('p2', 'Cy', 'coral', ''), P('p3', 'Ingrid', 'palm', ''), P('p4', 'Jack', 'mango', '')];
  // p1 wins round 6 and pays a gap; p4 started it last
  let lr = { round: 6, pot: 40, bids: { p1: 45, p2: 30, p3: 10, p4: 5 }, before: { p1: 60, p2: 50, p3: 30, p4: 70 }, after: { p1: 85, p2: 65, p3: 30, p4: 70 },
    steps: [{ t: 'win', id: 'p1', bid: 45, gain: 40, premium: 15, to: ['p2'], second: 30, share: 15 }] };
  const hist = [{ round: 5, pot: 40, bids: { p1: 12, p2: 25, p3: 8, p4: 3 } }, { round: 6, pot: 40, bids: lr.bids }];
  let status = 'playing', winners = [], torpedo = false, taunts = {}, inv = lr.after;
  if (kind === 'bust' || (kind === 'gag' && flag === 'gr')) {
    lr = { ...lr, bids: { p1: 120, p2: 30, p3: 10, p4: 5 }, after: { p1: 0, p2: 80, p3: 50, p4: 70 },
      steps: [{ t: 'bust', id: 'p1', bid: 120, premium: 90, lost: 60, keeps: false }, { t: 'win', id: 'p2', bid: 30, gain: 40, premium: 20, to: ['p3'], second: 10, share: 20 }] };
    inv = lr.after;
  }
  if (kind === 'record') { lr = { ...lr, bids: { p1: 120, p2: 30, p3: 10, p4: 5 } }; hist[1].bids = lr.bids; }
  if (kind === 'comeback') { lr = { ...lr, before: { p1: 10, p2: 50, p3: 30, p4: 70 }, after: { p1: 35, p2: 65, p3: 30, p4: 70 } }; inv = lr.after; }
  const endGame = kind === 'over' || kind === 'torpedo' || kind === 'gossip' || (kind === 'gag' && (flag === 'ch' || flag === 'no'));
  if (endGame) {
    status = 'over'; inv = { p1: 214, p2: 120, p3: 8, p4: 40 }; winners = flag === 'ch' ? ['p2'] : ['p1'];
    torpedo = kind === 'torpedo' || flag === 'ch';
    taunts = { p2: { rare: kind === 'gossip', n: 3 }, p3: { rare: false, n: 1 }, p4: { rare: false, n: 2 } };
  }
  S.code = 'DEMO';
  S.room = { code: 'DEMO', status, round: endGame ? 7 : kind === 'rematch' ? 1 : 7, pot: 105, me: 'p1', isHost: true, hostId: 'p1', players,
    order: ['p1', 'p2', 'p3', 'p4'], inventories: kind === 'rematch' ? { p1: 20, p2: 20, p3: 20, p4: 20 } : inv, myBid: null,
    lastResult: kind === 'rematch' ? null : lr, history: kind === 'rematch' ? [] : hist, winners, torpedo, taunts, shop: true, market: [], earned: {}, wallet: null, effects: [] };
  S.sheetFor = null; S.seen = 99; S.celebrated = celebKey(S.room); S.targeting = null; S.shopSheet = null; S.lastWinner = 'p1';
  render();
  const r = S.room, g = 'DEMO|0';
  const fxe = (k, blocked) => ({ kind: k, from: 'p2', target: 'p1', round: 7, at: Date.now(), ...(blocked ? { blocked } : {}) });
  const firstOf = kinds => roundStories(r, lr, g).find(c => kinds.includes(c.kind));
  let st;
  if (kind === 'over' || kind === 'torpedo') st = overStory(r, lr, g);
  else if (kind === 'bust') st = firstOf(['bust']);
  else if (kind === 'record') st = firstOf(['record']);
  else if (kind === 'comeback') st = firstOf(['comeback']);
  else if (kind === 'rematch') st = rematchStory(r);
  else if (kind === 'sabotage') st = fxStory(fxe(SAB_PAPER[arg] ? arg : 'kraken'));
  else if (kind === 'blocked') { const b = BLOCK_PAPER[arg] ? arg : 'bubble'; st = fxStory(fxe(b === 'hose' ? 'bomb' : b === 'umbrella' ? 'cloud' : 'kraken', b)); }
  else if (kind === 'gift') st = fxStory(fxe(GIFT_PAPER[arg] ? arg : 'diamond'));
  else if (kind === 'leave') { leaveTap(); return 'UK Leave paper. "Get Leave done" really leaves the demo room.'; }
  else if (kind === 'gossip') {
    const show = () => showPaper(gossipStory(r) || { kicker: 'THE BANANA GOSSIP', headline: 'Overheard on the docks', sub: 'About Cy: “(taunts could not load)”' });
    if (S.tauntBook) show(); else loadTaunts().then(show);
    return 'Gossip paper (Cy has a rare taunt).';
  } else if (kind === 'gag') {
    if (flag === 'gb') { leaveTap(); return 'gb: the Leave paper.'; }
    if (flag === 'se' || flag === 'fi') st = fxStory(fxe('kraken'));
    else if (flag === 'ch' || flag === 'no') st = overStory(r, lr, g);
    else if (flag === 'gr') st = firstOf(['bust']);
    else st = firstOf(['gag']);
  }
  if (!st) return `No "${kind}" story for that.`;
  showPaper(st);
  return `${kind}${arg ? ' ' + arg : ''}: ${st.headline}`;
}

// ---------- victory show (visual only; never touches scores) ----------
// Torpedo battle pacing (seconds): first shot after START, one shot every GAP, each torpedo runs TRAVEL,
// a hit ship takes SINK to go under, and the panel lingers LINGER after the last one before the party.
const BATTLE = { start: 1.2, gap: 1.3, travel: 1.4, sink: 2.6, linger: 1.5 };
const PARTY_COLORS = ['#FFD60A', '#FF3E8A', '#3FD0E0', '#FF9F1C', '#2BB673', '#FFFFFF'];
const rand = (lo, hi) => lo + Math.random() * (hi - lo);
function maybeCelebrate() {
  const r = S.room;
  if (!r || r.status !== 'over' || S.sheetFor != null) return;
  const key = celebKey(r);
  if (S.celebrated === key) return;
  S.celebrated = key;
  celebrate(r);
}
function celebrate(r) {
  document.getElementById('party')?.remove();
  const party = document.createElement('div');
  party.id = 'party'; party.setAttribute('aria-hidden', 'true');
  document.body.appendChild(party);
  const rivals = r.order.filter(id => !r.winners.includes(id));
  const torpedo = r.torpedo && rivals.length > 0;
  const names = ids => ids.map(id => esc(nickOf(id))).join(' and ');
  // A captain whose flag has a torpedo gag (GAGS.ch) isn't sunk: the torpedo swerves around them.
  const dodge = id => gagAt(id, 'torpedo'), dodgers = rivals.filter(dodge), sunk = rivals.filter(id => !dodge(id));
  const sankLine = (sunk.length ? `💥 Torpedoes sank ${names(sunk)}!` : '💥 Torpedoes away!')
    + (dodgers.length ? `<br>${dodgers.map(id => `🇨🇭 ${esc(nickOf(id))}: ${esc(dodge(id).caption)}`).join('<br>')}` : '');
  // Winners (and spectators) get the party; losers get a storm, and in torpedo games a close-up of their own sinking.
  const lost = r.order.includes(r.me) && !r.winners.includes(r.me);
  const winnerName = names(r.winners);
  const hitMe = dodge(r.me) ? `💥 ${winnerName} fired at your ship. It swerved: ${esc(dodge(r.me).caption)}` : `💥 ${winnerName} torpedoed your ship!`;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    party.innerHTML = lost
      ? `<div class="party-banner">⛈ ${winnerName} ${r.winners.length > 1 ? 'take' : 'takes'} the bananas.${torpedo ? `<br>${hitMe}` : ''}</div>`
      : `<div class="party-banner">🎉 ${winnerName} ${r.winners.length > 1 ? 'win' : 'wins'}!${torpedo ? '<br>' + sankLine : ''}</div>`;
    return setTimeout(() => { if (party.isConnected) endParty(); }, 5000);
  }
  if (lost) {
    const t = torpedo ? BATTLE.start + BATTLE.travel + BATTLE.sink + BATTLE.linger : 0;
    if (torpedo) party.insertAdjacentHTML('beforeend', battleView(r, [r.me], hitMe, true));
    setTimeout(() => { party.querySelector('.battle')?.remove(); party.insertAdjacentHTML('beforeend', stormView(r, winnerName)); }, t * 1000);
    setTimeout(() => { if (party.isConnected) endParty(); }, (t + 7.5) * 1000);
    return;
  }
  let t = 0;
  if (torpedo) { party.insertAdjacentHTML('beforeend', battleView(r, rivals, sankLine)); t = BATTLE.start + (rivals.length - 1) * BATTLE.gap + BATTLE.travel + BATTLE.sink + BATTLE.linger; }
  setTimeout(() => {
    party.querySelector('.battle')?.remove();
    party.insertAdjacentHTML('beforeend', rainView() + fireworksView());
  }, t * 1000);
  setTimeout(() => { if (party.isConnected) endParty(); }, (t + 7) * 1000);
}
function rainView() {
  let h = '';
  for (let i = 0; i < 46; i++) {
    const w = rand(26, 52), r0 = rand(-90, 90);
    h += `<svg class="drop" viewBox="0 0 26 12" style="--x:${rand(-4, 98).toFixed(1)}vw;--w:${w.toFixed(0)}px;--t:${rand(2.4, 4.4).toFixed(2)}s;--d:${rand(0, 2.2).toFixed(2)}s;--r0:${r0.toFixed(0)}deg;--r1:${(r0 + rand(-540, 540)).toFixed(0)}deg"><use href="#nana"/></svg>`;
  }
  return h;
}
// The losers' weather: full screen, your own ship rocking under dark clouds in slanting rain, two lightning
// flashes and soggy banana peels. Tap anywhere to skip it.
function stormView(r, winnerName) {
  let rain = '', peels = '';
  for (let i = 0; i < 70; i++) rain += `<i class="rainline" style="--x:${rand(-10, 105).toFixed(1)}vw;--t:${rand(0.45, 0.8).toFixed(2)}s;--d:${rand(0, 1.2).toFixed(2)}s"></i>`;
  for (let i = 0; i < 11; i++) {
    const r0 = rand(-40, 40);

    ${rain}${peels}</div>`;
}
function fireworksView() {
  let h = '';
