<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puerto Banana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Visual QA checklist (check after any layout change):
   - 320px and 390px wide: no horizontal scroll, rows wrap, title fits
   - safe-area insets on notched phones (top/bottom/left/right padding on #app and .sheet)
   - every tap target >= 44px tall, :focus-visible ring on every control
   - light + dark, and prefers-reduced-motion (ships stop bobbing, waves stop, reveal stops flipping)
   - cargo ships at fill 0, 0.5, 1 and >1 read as empty / half / full / overfull */
:root{
  --bg:#FFF8EC; --bg-2:#DDF7F6; --surface:#FFFFFF; --ink:#0B3954; --muted:#4D6F80; --line:#D3ECEA;
  --banana:#FFD60A; --banana-ink:#3A2F00; --banana-edge:#E5A100;
  --coral:#D93842; --ok:#078A7E;
  --sea:#3FD0E0; --sea-deep:#0582B8; --sky:#A6ECF5; --sky-2:#E9FCFF;
  --hull:#1D4E89; --keel:#FF6B6B; --rail:#1D4E89; --cabin:#FFFFFF;
  --mango:#FF9F1C; --hibiscus:#FF3E8A; --palm:#2BB673; --trunk:#9C6B3C; --sand:#FFE0A3; --sun:#FFC93C; --cloud:#FFFFFF; --smoke-dark:#5F6873; --smoke-light:#F4F7F9;
 
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071F2E; --bg-2:#0B3346; --surface:#0E3448; --ink:#EAFBFF; --muted:#9CC7D4; --line:#1B4A60;
    --banana-ink:#2A2200; --banana-edge:#C98E00; --coral:#FF7A7F; --ok:#3ED6C2;
    --sea:#0F7C99; --sea-deep:#06506E; --sky:#12425C; --sky-2:#0A2A3E;
    --hull:#2A64A8; --keel:#E85A5A; --rail:#7FB4E8; --cabin:#DCEFF5;
    --palm:#23A866; --trunk:#B88553; --sand:#C9A66B; --sun:#FFF0B8; --cloud:#2B5A73; --smoke-dark:#7F8A95; --smoke-light:#CBD6DD;

  }
}
:root[data-theme="dark"]{
  --bg:#071F2E; --bg-2:#0B3346; --surface:#0E3448; --ink:#EAFBFF; --muted:#9CC7D4; --line:#1B4A60;
  --banana-ink:#2A2200; --banana-edge:#C98E00; --coral:#FF7A7F; --ok:#3ED6C2;
  --sea:#0F7C99; --sea-deep:#06506E; --sky:#12425C; --sky-2:#0A2A3E;
  --hull:#2A64A8; --keel:#E85A5A; --rail:#7FB4E8; --cabin:#DCEFF5;
  --palm:#23A866; --trunk:#B88553; --sand:#C9A66B; --sun:#FFF0B8; --cloud:#2B5A73; --smoke-dark:#7F8A95; --smoke-light:#CBD6DD;

}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg) linear-gradient(var(--bg-2),var(--bg) 480px) no-repeat;color:var(--ink);font:400 17px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:460px;margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1,h2,.num{font-family:Bungee,Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.01em}
h2{font-size:1.25rem;margin:0 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:10px 18px;min-height:48px;font-weight:800;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--sea),0 3px 0 var(--line);touch-action:manipulation}
button.primary{background:linear-gradient(var(--banana),color-mix(in srgb,var(--banana) 80%,var(--mango)));color:var(--banana-ink);box-shadow:0 4px 0 var(--banana-edge)}
button.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--banana-edge)}
button:disabled{opacity:.45;cursor:default}
button.link{background:none;box-shadow:none;padding:0 4px;min-height:44px;color:var(--muted);font-weight:600;text-decoration:underline;text-align:left}
.wide{width:100%}
:focus-visible{outline:3px solid var(--hibiscus);outline-offset:2px}
input.text{width:100%;min-height:48px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
input.text:focus{border-color:var(--sea)}
input.code{text-transform:uppercase;font-family:Bungee,sans-serif;letter-spacing:.2em;min-width:0}
label,.label{display:block;font-weight:600;margin:0 0 6px}
.hullpick{display:grid;grid-template-columns:auto minmax(0,120px);gap:12px;align-items:center}
.swatches{display:grid;grid-template-columns:repeat(4,44px);gap:8px}
.swatch{min-height:44px;width:44px;padding:0;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.swatch[aria-checked="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 140px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:0 3px 0 var(--line)}
.divider{height:4px;margin:24px 0;background:radial-gradient(circle,var(--sea) 1.6px,transparent 2.2px) 0 0/12px 4px repeat-x}
.err{color:var(--coral);font-weight:600}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:.88rem;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.topbar .code{font-family:Bungee,sans-serif;letter-spacing:.15em}

/* Cargo ships: one SVG drawing (shipSVG) loaded from an empty hold to bananas spilling overboard */
.shipsvg,.scene{display:block;width:100%;height:auto}
.tile{display:block;border-radius:12px;overflow:hidden;background:linear-gradient(var(--sky-2),var(--sky))}
.sh-hull{fill:var(--hull)} .sh-keel{fill:var(--keel)} .sh-stripe{stroke:#fff;stroke-width:2.5}
.sh-cabin{fill:var(--cabin)} .sh-win{fill:var(--sea-deep)} .sh-funnel{fill:var(--mango)} .sh-band{fill:var(--hibiscus)}
.sh-port{fill:#fff;opacity:.85} .sh-flag{fill:var(--hibiscus)}
.sh-mast{stroke:var(--rail);stroke-width:2.2;stroke-linecap:round;fill:none}
.sh-sea{fill:var(--sea-deep)} .sh-sea2{fill:var(--sea)}
.nb{fill:var(--banana);stroke:var(--banana-edge);stroke-width:.9;stroke-linejoin:round} .nb-tip{stroke:#5B4214;stroke-width:1.6;stroke-linecap:round}
.hs-sun{fill:var(--sun)} .hs-glow{fill:var(--sun);opacity:.25} .hs-cloud{fill:var(--cloud);opacity:.9}
.hs-bird{stroke:var(--ink);stroke-width:1.4;fill:none;stroke-linecap:round;opacity:.6}
.hs-sand{fill:var(--sand)} .hs-trunk{stroke:var(--trunk);stroke-width:5;fill:none;stroke-linecap:round} .hs-palm{fill:var(--palm)} .hs-nut{fill:var(--trunk)}
.sh-bob{animation:bob 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sh-wave{animation:drift 5s linear infinite}
.sh-float{animation:float 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.still .sh-bob,.still .sh-wave,.still .sh-float{animation:none}
/* Funnel smoke: each puff grows, lightens and drifts back over the stern; timings are per ship (see shipBody) */
.puff{filter:url(#smokeblur);transform-box:fill-box;transform-origin:center;opacity:0;animation:puff var(--t) cubic-bezier(.3,.6,.5,1) var(--d) infinite}
@keyframes puff{0%{fill:var(--smoke-dark);opacity:0;transform:translate(0,0) scale(1)}
  8%{opacity:var(--o)}
  50%{opacity:calc(var(--o) * .75);transform:translate(calc(var(--dx) * .35),calc(var(--dy) * .6)) scale(calc(var(--s) * .6))}
  100%{fill:var(--smoke-light);opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--s))}}
.still .puff{display:none}
/* Ship flags: a gentle wave on moving ships; the invisible tap target on your own ship opens the picker */
.sh-wave-flag{transform-box:fill-box;transform-origin:left center;animation:flagwave 2.6s ease-in-out infinite}
@keyframes flagwave{50%{transform:skewY(5deg) scaleX(.92)}}
.still .sh-wave-flag{animation:none}
.flag-hit{fill:transparent;cursor:pointer;pointer-events:all}
.flaggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.flagbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:80px;padding:8px 4px;font-size:.78rem;font-weight:600;line-height:1.2;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.flagbtn img,.flagbtn svg{width:44px;height:33px;border-radius:3px;box-shadow:0 0 0 1px var(--line);object-fit:cover}
.flagbtn span{overflow:hidden;text-overflow:ellipsis;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.flagbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
.flaggrid>p{grid-column:1/-1}
.wiggle{animation:wiggle 1.2s ease-in-out}
@keyframes wiggle{20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1.5deg)}80%{transform:rotate(1deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1.5px) rotate(-.8deg)}}
@keyframes drift{to{transform:translateX(-30px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(8deg)}}

/* Home: a Caribbean bay */
.harbor{border-radius:24px;overflow:hidden;background:linear-gradient(var(--sky-2),var(--sky) 70%);margin-bottom:18px;box-shadow:0 4px 0 var(--line)}
.harbor h1{margin:0;padding:18px 16px 0;text-align:center;color:var(--ink);font-size:clamp(1.6rem,8.6vw,2.4rem);line-height:1.05;text-shadow:3px 3px 0 var(--banana),5px 5px 0 var(--mango)}
.harbor-foot{background:var(--sea-deep);color:#fff;margin:-1px 0 0;padding:2px 16px 16px;font-size:.95rem}

/* The pot: the ship up for auction */
.potcard{border-radius:20px;background:var(--sea-deep);color:#fff;padding:12px 18px 14px;box-shadow:0 4px 0 var(--line)}
.plate{display:inline-block;background:var(--hibiscus);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem}
.potcard .num{font-size:clamp(2.6rem,14vw,3.6rem);line-height:1;margin-top:6px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.potcard .sub{font-weight:600;opacity:.95}
/* Your own ship: the big animated bay; opponents get small stills in the list */
.myship{margin-top:12px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--sky-2),var(--sky) 70%);box-shadow:0 4px 0 var(--line)}
.myship-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--sea-deep);color:#fff;margin-top:-1px;padding:2px 16px 12px;line-height:1.25}
.myship-foot .num{font-size:1.9rem;line-height:1}
.players{list-style:none;margin:0;padding:0}
.players li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"ship name inv" "ship status inv";gap:0 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.players li:last-child{border-bottom:0}
.players .tile{grid-area:ship}
.players li.me .name{color:var(--coral)}
.players .name{grid-area:name;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:end}
.players .inv{grid-area:inv;font-family:Bungee,sans-serif;font-size:1.15rem;text-align:right}
.players .status{grid-area:status;font-size:.88rem;color:var(--muted);align-self:start}
.players .status.ok{color:var(--ok);font-weight:600}
.bidbox{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;align-items:stretch}
.bidbox button{font-size:1.6rem;padding:0}
.bidbox input{width:100%;min-width:0;text-align:center;font-family:Bungee,sans-serif;font-size:2.2rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:6px 0}
/* A sealed bid is lashed down with rope */
.locked{text-align:center;padding:20px 16px;border:3px dashed var(--mango)}
.locked .num{font-size:2.6rem}
.sheet-bg{position:fixed;inset:0;background:rgba(4,30,45,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;border-top:6px solid var(--sea);
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.reveal{list-style:none;padding:0;margin:0 0 14px}
.reveal li{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--surface);margin-bottom:8px;animation:flip .45s both}
.reveal li .tile{flex:0 0 60px}
.reveal li .who{flex:1;min-width:0}
.reveal li .num{font-size:1.5rem}
.reveal li.top{box-shadow:inset 0 0 0 3px var(--banana)}
.delta{font-weight:800}
.delta.up{color:var(--ok)} .delta.down{color:var(--coral)}
.story{list-style:none;margin:0 0 14px;padding:10px 14px;border-radius:14px;background:var(--surface);border-left:6px solid var(--banana)}
.story li{padding:5px 0}
.story li+li{border-top:1px solid var(--line)}
.reveal li .who{display:flex;flex-direction:column}
.reveal li .bid{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.winner{text-align:center;padding:0 0 16px;overflow:hidden}
.winner .tile{border-radius:0;margin-bottom:12px}
.winner .tile .shipsvg{max-width:320px;margin:0 auto}
.winner .num{font-size:clamp(1.8rem,9vw,2.6rem);color:var(--coral);overflow-wrap:anywhere;padding:0 12px}
details{margin-top:18px}
summary{cursor:pointer;font-weight:600;color:var(--muted);min-height:44px;display:flex;align-items:center}
.hist{font-size:.92rem}
.hist div{padding:6px 0;border-bottom:1px solid var(--line)}
/* Harbour log: the shared top 20 */
.log h2{margin-bottom:4px}
.log ol{list-style:none;margin:10px 0 0;padding:0}
.log li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:baseline;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .rank{font-family:Bungee,sans-serif;color:var(--muted)}
.log li:nth-child(1) .rank{color:var(--mango)} .log li:nth-child(2) .rank{color:var(--sea-deep)} .log li:nth-child(3) .rank{color:var(--hibiscus)}
.log .who{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .when{grid-column:2;font-size:.82rem;color:var(--muted)}
.log .score{font-family:Bungee,sans-serif;font-size:1.1rem;grid-column:3;grid-row:1}
/* Rivals chart: win rate per captain, each line in its hull colour */
.rivals h2{margin-bottom:4px}
.rv-chart{display:block;width:100%;height:auto;margin:0 0 6px}
.rv-grid{stroke:var(--line);stroke-width:1}
.rv-tick{fill:var(--muted);font:600 11px Figtree,system-ui,sans-serif}
.rv-line path{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.rv-line circle{fill:var(--c);stroke:var(--surface);stroke-width:2}
.rv-me path{stroke-width:3.6}
.rv-faded{opacity:.15}
.rv-legend{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.rv-chip{width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;font-weight:600;text-align:left;box-shadow:inset 0 0 0 1px var(--line)}
.rv-chip[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
.rv-dot{width:12px;height:12px;border-radius:50%}
.rv-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-stat{font-size:.85rem;color:var(--muted);font-weight:600}
/* Victory show: banana rain, fireworks and (1 game in 5) torpedoes. Lives outside #app so re-renders keep it. */
#party{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
#party .drop{position:absolute;top:-8vh;left:var(--x);width:var(--w);animation:fall var(--t) linear var(--d) both}
@keyframes fall{from{transform:translateY(0) rotate(var(--r0))}to{transform:translateY(118vh) rotate(var(--r1))}}
#party .burst{position:absolute;left:var(--x);top:var(--y)}
#party .burst i{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);
  transform:rotate(var(--a)) translateX(0);opacity:0;animation:spark 1.1s cubic-bezier(.15,.7,.3,1) var(--d) both}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}70%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--len)) translateY(14px)}}
#party .battle{position:absolute;left:50%;top:22%;width:min(92vw,420px);transform:translateX(-50%);border-radius:20px;overflow:hidden;
  background:linear-gradient(var(--sky-2),var(--sky));box-shadow:0 10px 40px rgba(0,0,0,.35);animation:pop .3s ease-out both}
#party .battle p{margin:0;padding:8px 14px 12px;background:var(--sea-deep);color:#fff;font-weight:800;text-align:center}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.9)}}
.torp{animation:torp .8s ease-in var(--d) both}
@keyframes torp{from{transform:translate(0,0);opacity:1}95%{opacity:1}to{transform:translate(var(--dx),0);opacity:0}}
.boom{transform-box:fill-box;transform-origin:center;animation:boom .6s ease-out var(--d) both}
@keyframes boom{from{transform:scale(0);opacity:1}to{transform:scale(1.6);opacity:0}}
.sinking{transform-box:fill-box;transform-origin:60% 100%;animation:sink 1.6s ease-in var(--d) both}
@keyframes sink{from{transform:none}25%{transform:rotate(-12deg)}to{transform:translateY(90px) rotate(-30deg)}}
.bubble{animation:rise 1.4s ease-out var(--d) both}
@keyframes rise{from{transform:translateY(0);opacity:0}20%{opacity:.9}to{transform:translateY(-26px);opacity:0}}
.flotsam{animation:surface 1s ease-out var(--d) both}
@keyframes surface{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.party-banner{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:min(92vw,420px);background:var(--surface);color:var(--ink);
  border-radius:16px;padding:12px 16px;font-weight:800;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.reveal li,.sh-bob,.sh-wave,.sh-float,.sh-wave-flag,.wiggle{animation:none}.puff{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <filter id="smokeblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <symbol id="nana" viewBox="0 0 26 12"><path class="nb" d="M2 3C6 10.5 18 11.5 23.5 3.5 22.8 2.6 21.7 2.5 21 3.2 16 8 8 7.8 4 2.4 3.3 1.8 2.3 2.1 2 3Z"/><path class="nb-tip" d="M22.5 3.4 24.6 1.2"/></symbol>
  <symbol id="flag-pirate" viewBox="0 0 40 30"><rect width="40" height="30" fill="#111"/><circle cx="20" cy="12" r="6" fill="#fff"/><rect x="16.5" y="15" width="7" height="4" rx="1" fill="#fff"/><circle cx="17.7" cy="11.5" r="1.6" fill="#111"/><circle cx="22.3" cy="11.5" r="1.6" fill="#111"/><path d="M9 21 31 27M31 21 9 27" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="flag-banana" viewBox="0 0 40 30"><rect width="40" height="30" fill="#2BB673"/><rect y="10" width="40" height="10" fill="#FFD60A"/><path d="M9 12C13 24 28 25 33 12 31 11 30 11 29 12 25 19 15 19 12 11 11 10 9.5 11 9 12Z" fill="#FFD60A" stroke="#C98E00" stroke-width="1.2"/></symbol>
  <symbol id="flag-rainbow" viewBox="0 0 40 30"><rect width="40" height="5" fill="#E40303"/><rect y="5" width="40" height="5" fill="#FF8C00"/><rect y="10" width="40" height="5" fill="#FFED00"/><rect y="15" width="40" height="5" fill="#008026"/><rect y="20" width="40" height="5" fill="#24408E"/><rect y="25" width="40" height="5" fill="#732982"/></symbol>
  <symbol id="flag-chequered" viewBox="0 0 4 3"><rect width="4" height="3" fill="#fff"/><path d="M0 0h1v1H0zM2 0h1v1H2zM1 1h1v1H1zM3 1h1v1H3zM0 2h1v1H0zM2 2h1v1H2z" fill="#111"/></symbol>
  <symbol id="flag-white" viewBox="0 0 40 30"><rect x=".5" y=".5" width="39" height="29" fill="#fff" stroke="#c9d3d9"/></symbol>
  <symbol id="bunch" viewBox="0 0 26 18"><use href="#nana" width="26" height="12"/><use href="#nana" x="1" y="3" width="25" height="12"/><use href="#nana" y="6" width="26" height="12"/></symbol>
</defs></svg>
<div id="app"><p class="muted">Loading the docks…</p></div>
<script>
const GOAL = 200, MAX_PLAYERS = 6;
const S = { hull: 'navy', flag: '', flagSheet: false, flagQuery: '', countries: null, code: null, room: null, es: null, nick: '', joinCode: '', bidDraft: '', error: '', busy: false, sheetFor: null, seen: 0, scores: null, rivals: null, rivalHi: null };
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
function token() {
  let t = ls.get('pb_token');
  if (!t || !/^[a-f0-9]{32}$/.test(t)) { const a = new Uint8Array(16); crypto.getRandomValues(a); t = [...a].map(b => b.toString(16).padStart(2, '0')).join(''); ls.set('pb_token', t); }
  return t;
}
async function api(action, extra = {}) {
  const r = await fetch('/api', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, token: token(), code: S.code, ...extra }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong. Try again.');
  return d;
}
async function act(fn) { S.busy = true; S.error = ''; render(); try { await fn(); } catch (e) { S.error = e.message; } S.busy = false; render(); }

// ---------- harbour log (shared highscores) ----------
// S.scores: null = loading, array = loaded, 'error' = unavailable. Never blocks rooms.
async function loadScores() {
  try {
    const r = await fetch('/api/highscores');
    if (!r.ok) throw new Error();
    const d = await r.json();
    S.scores = Array.isArray(d) ? d : 'error';
  } catch (e) { S.scores = 'error'; }
  if (!S.code || !S.room) render();
}

// ---------- rivals chart (game history) ----------
// S.rivals: null = loading, object = loaded, 'error' = unavailable. Never blocks rooms.
// Only the newest request may land, so a slow answer for an older name never overwrites a newer one.
let rivalsSeq = 0;
async function loadRivals() {
  const seq = ++rivalsSeq;
  let next;
  try {
    const r = await fetch('/api/rivals?name=' + encodeURIComponent(S.nick.trim()));
    if (!r.ok) throw new Error();
    const d = await r.json();
    next = d && Array.isArray(d.players) ? d : 'error';
  } catch (e) { next = 'error'; }
  if (seq !== rivalsSeq) return;
  S.rivals = next;
  if (next === 'error' || !next.players.some(p => p.key === S.rivalHi)) S.rivalHi = null; // never leave every line faded
  if (!S.code || !S.room) render();
}
function toggleRival(i) { const k = S.rivals.players[i].key; S.rivalHi = S.rivalHi === k ? null : k; render(); }

// ---------- cargo ships ----------
// One ship drawing, loaded by fill: 0 = empty hold, 1 = full to the rails, >1 = piled high and spilling.
// The hold takes 28 bunches (about 7 bananas each); the hull also sinks with every banana, so the
// picture keeps changing from 0 to GOAL. Single bananas only ever float in the sea, never on deck.
// Ship coordinates are 220 wide with the waterline near y 92. The load sets how deep it sits: empty rides
// high on its red keel, at GOAL the rail is just above the water, overfull puts the deck awash.
const HOLD = { x: 66, cols: 7, rows: 4, w: 19, h: 9, deck: 51, bh: 11 };
const SLOTS = HOLD.cols * HOLD.rows;
const wob = i => (i * 37 % 13) - 6; // stable per-bunch tilt so piles look stacked by hand
const overflow = f => f > 1.03 ? Math.min(15, Math.max(2, Math.round((f - 1) * SLOTS))) : 0;
const cargoWord = f => f <= 0 ? 'Empty' : f < 0.1 ? 'A few bananas' : f < 0.25 ? 'Light load' : f < 0.4 ? 'Filling up' : f < 0.6 ? 'Half full'
  : f < 0.8 ? 'Well stocked' : f < 0.95 ? 'Nearly full' : overflow(f) ? (f < 1.3 ? 'Overfull' : 'Sinking with bananas') : 'Full';
const bunch = (x, y, i) => `<use href="#bunch" x="${x}" y="${y}" width="${HOLD.w}" height="${HOLD.bh}" transform="rotate(${wob(i)} ${x + HOLD.w / 2} ${y + 7})"/>`;
const slotX = i => HOLD.x + (i % HOLD.cols) * HOLD.w, slotY = i => HOLD.deck - HOLD.bh - Math.floor(i / HOLD.cols) * HOLD.h;
function waves(y, width, bottom, cls) {
  let d = `M0 ${y}`;
  for (let x = 0; x < width + 30; x += 30) d += 'q7.5 -4 15 0t15 0';
  return `<path class="${cls}" d="${d}V${bottom}H0Z"/>`;
}
// Seeded randomness: each ship's floating bananas stay put across re-renders, and change when its load
// changes or the page reloads.
const SEA_SEED = (Math.random() * 2 ** 32) >>> 0;
function rng(key) {
  let h = SEA_SEED;
  for (const c of String(key)) h = Math.imul(h ^ c.charCodeAt(0), 2654435761);
  return () => { h = (h + 0x6D2B79F5) | 0; let t = Math.imul(h ^ (h >>> 15), 1 | h); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 2 ** 32; };
}
// ---------- flags (secret: tap the flag on your own ship) ----------
// Country flags come from the MIT-licensed flag-icons set on jsDelivr; easter eggs are drawn above in <defs>.
const FLAG_CDN = 'https://cdn.jsdelivr.net/npm/flag-icons@7.5.0/';
const FLAG_EGGS = { pirate: ['Jolly Roger', ['pirate', 'jolly', 'roger', 'skull']], banana: ['Banana Republic', ['banana']],
  rainbow: ['Rainbow', ['rainbow', 'pride']], chequered: ['Chequered', ['chequered', 'checkered', 'race', 'finish']],
  white: ['White flag', ['white', 'surrender']] };
const FLAG_EXTRAS = ['eu', 'un', 'gb-eng', 'gb-sct', 'gb-wls', 'gb-nir']; // non-country flags worth offering
const flagOf = f => FLAG_EGGS[f] || /^[a-z]{2}(-[a-z]{2,4})?$/.test(f || '') ? f : ''; // mirrors players.js
const flagOfId = id => pl(id).flag;
// The flag at the masthead, in ship coordinates; '' is the default pink pennant.
function mastFlag(flag) {
  flag = flagOf(flag);
  if (!flag) return `<path class="sh-flag" d="M206 20 218 24 206 28Z"/>`;
  // Drawn at 0,0 inside a group pinned to the masthead, so the wave (skew/scale about the left edge) stays on the pole.
  const box = 'width="13" height="9.75"';
  const art = FLAG_EGGS[flag] ? `<use href="#flag-${flag}" ${box}/>` : `<image href="${FLAG_CDN}flags/4x3/${flag}.svg" ${box} preserveAspectRatio="none"/>`;
  return `<g transform="translate(206.5 19)"><g class="sh-wave-flag">${art}</g></g>`;
}
function shipBody(f, key = '', flag = '', mine = false) {
  const n = f > 0 ? Math.max(1, Math.round(Math.min(f, 1) * SLOTS)) : 0, over = overflow(f);
  let cargo = '';
  for (let i = 0; i < n; i++) cargo += bunch(slotX(i), slotY(i), i);
  // Overfull: a pyramid of 6, 5, 4 bunches above the rails
  for (let t = 0, left = over, k = HOLD.cols - 1; left > 0; t++, k--) {
    const m = Math.min(k, left), x0 = HOLD.x + (HOLD.cols - k) * HOLD.w / 2;
    for (let c = 0; c < m; c++) cargo += bunch(x0 + c * HOLD.w, HOLD.deck - HOLD.bh - (HOLD.rows + t) * HOLD.h, 50 + t * 7 + c);
    left -= m;
  }
  // Funnel smoke, individual per ship: heavier loads puff more, bigger and darker
  const srnd = rng(key + '|smoke'), puffs = 5 + Math.round(Math.min(f, 1.2) * 2.5), beat = 2.8 + srnd() * 1.4;
  let smoke = '';
  for (let i = 0; i < puffs; i++) {
    const t = beat + srnd() * 0.8, d = -(i / puffs) * t - srnd() * 0.4;
    smoke += `<circle class="puff" cx="${(34 + srnd() * 2).toFixed(1)}" cy="2" r="${(3 + srnd() + Math.min(f, 1.2)).toFixed(1)}" style="--t:${t.toFixed(2)}s;--d:${d.toFixed(2)}s;--dx:${(-16 - srnd() * 20).toFixed(0)}px;--dy:${(-24 - srnd() * 16).toFixed(0)}px;--s:${(2.8 + srnd() * 2).toFixed(2)};--o:${(0.6 + srnd() * 0.15 + Math.min(f, 1) * 0.15).toFixed(2)}"/>`;
  }
  const sink = (-6 + Math.min(f, 1) * 42 + Math.min(Math.max(f - 1, 0), 0.6) * 10).toFixed(1), tilt = over ? 1.8 : 0;
  const ports = [44, 64, 84, 104, 124, 144, 164, 184].map(x => `<circle class="sh-port" cx="${x}" cy="64" r="2.4"/>`).join('');
  const ship = `<g transform="translate(0 ${sink}) rotate(${tilt} 110 80)"><g class="sh-bob">
    <path class="sh-mast" d="M128 50V12M128 16 158 26"/>
    <rect class="sh-cabin" x="16" y="22" width="40" height="34" rx="3"/>
    <rect class="sh-win" x="21" y="28" width="30" height="6" rx="2"/><rect class="sh-win" x="21" y="39" width="30" height="5" rx="2"/>
    <path class="sh-funnel" d="M25 22 27 2H43L45 22Z"/><rect class="sh-band" x="26.5" y="7" width="17" height="5"/>${smoke}
    ${cargo}
    <path class="sh-hull" d="M6 52 212 45 200 82H22Z"/><path class="sh-keel" d="M22 82H200L192 100H30Z"/><path class="sh-stripe" d="M22 82H200"/>${ports}
    <path class="sh-mast" d="M206 46V19"/>${mastFlag(flag)}${mine ? '<rect class="flag-hit" x="186" y="0" width="34" height="40" onclick="openFlags(event)"/>' : ''}</g></g>`;
  // Overfull ships shed a random handful of bananas into the sea around them
  const rnd = rng(key + '|' + Math.round(f * GOAL));
  const floats = over ? 1 + Math.floor(rnd() * (2 + over / 2)) : 0;
  let spill = '';
  for (let i = 0; i < floats; i++) {
    const w = 13 + rnd() * 7, x = rnd() * (214 - w), y = 98 + rnd() * 13, a = Math.round(rnd() * 140 - 70);
    spill += `<g class="sh-float" style="animation-delay:${(-rnd() * 3).toFixed(2)}s;animation-duration:${(2.6 + rnd() * 1.6).toFixed(2)}s"><use href="#nana" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(w / 2).toFixed(1)}" transform="rotate(${a} ${(x + w / 2).toFixed(1)} ${(y + w / 4).toFixed(1)})"/></g>`;
  }
  return { ship, spill };
}
// Hull colours players pick on the home screen; keys match HULLS in server.js.
const HULLS = { navy: ['Navy', '#1D4E89'], coral: ['Coral', '#E0505B'], mango: ['Mango', '#EE8A1E'], hibiscus: ['Hibiscus', '#D63A85'],
  palm: ['Palm green', '#2A9457'], turquoise: ['Turquoise', '#0E97A5'], purple: ['Purple', '#6A4C93'], charcoal: ['Charcoal', '#33414E'] };
const hullStyle = hull => HULLS[hull] ? ` style="--hull:${HULLS[hull][1]}"` : '';
const hullOfId = id => pl(id).hull;
function shipSVG(fill, label, key, hull, flag, mine) {
  const f = Math.max(0, Number(fill) || 0), { ship, spill } = shipBody(f, key, flag, mine);
  const a11y = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"';
  return `<svg class="shipsvg" viewBox="0 -18 220 138" ${a11y}${hullStyle(hull)}>${waves(88, 220, 120, 'sh-sea2')}${ship}${waves(93, 220, 120, 'sh-sea sh-wave')}${spill}</svg>`;
}
const tile = (fill, still, key, hull, flag, mine) => `<span class="tile${still ? ' still' : ''}">${shipSVG(fill, '', key, hull, flag, mine)}</span>`;
function heroScene(fill = 0.75, key = 'hero', hull, flag, mine) {
  const { ship, spill } = shipBody(fill, key, flag, mine), place = 'transform="translate(10 52) scale(1.1)"';
  const fronds = ['c10-12 26-12 36-2c-12-4-24-2-36 2z', 'c-6-14-20-18-32-12c12 0 24 4 32 12z', 'c-14-2-26 6-30 18c8-10 18-14 30-18z', 'c14-2 26 6 30 18c-8-10-18-14-30-18z', 'c2-14 12-22 24-22c-10 4-18 12-24 22z'];
  return `<svg class="scene" viewBox="0 0 360 196" aria-hidden="true"${hullStyle(hull)}>
    <circle class="hs-glow" cx="300" cy="40" r="36"/><circle class="hs-sun" cx="300" cy="40" r="22"/>
    <g class="hs-cloud"><ellipse cx="62" cy="34" rx="26" ry="8"/><ellipse cx="78" cy="28" rx="15" ry="9"/><ellipse cx="200" cy="20" rx="18" ry="5"/></g>
    <path class="hs-bird" d="M150 46q4-4 8 0q4-4 8 0M176 34q3-3 6 0q3-3 6 0"/>
    ${waves(146, 360, 196, 'sh-sea2')}
    <ellipse class="hs-sand" cx="336" cy="150" rx="50" ry="11"/>
    <path class="hs-trunk" d="M336 148C333 126 328 106 318 92"/>
    ${fronds.map(d => `<path class="hs-palm" d="M318 92${d}"/>`).join('')}
    <circle class="hs-nut" cx="316" cy="96" r="2.6"/><circle class="hs-nut" cx="321" cy="95" r="2.6"/>
    <g ${place}>${ship}</g>${waves(156, 360, 196, 'sh-sea sh-wave')}<g ${place}>${spill}</g></svg>`;
}

// ---------- rooms ----------
function createRoom() {
  if (!S.nick.trim()) { S.error = 'Pick a name first.'; return render(); }
  act(async () => { const { code } = await api('create', { nick: S.nick, hull: S.hull, flag: S.flag }); connect(code); });
}
function enterRoom(code, silent) {
  code = String(code || '').trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)) { if (!silent) { S.error = 'Room codes are 4 letters.'; render(); } return; }
  if (!silent && !S.nick.trim()) { S.error = 'Pick a name first.'; return render(); }
  act(async () => {
    try { await api('join', { code, nick: S.nick, hull: S.hull, flag: S.flag }); connect(code); }
    catch (e) { ls.del('pb_code'); if (!silent) throw e; }
  });
}
function connect(code) {
  if (S.es) S.es.close();
  S.code = code; ls.set('pb_code', code); ls.set('pb_nick', S.nick);
  S.es = new EventSource('/events?room=' + code + '&token=' + token());
  S.es.onmessage = ev => { S.room = JSON.parse(ev.data); onChange(); };
  S.es.onerror = () => { if (S.es && S.es.readyState === EventSource.CLOSED) { dropRoom(); S.error = 'That room is gone (the server may have restarted). Create a new one.'; render(); } };
}
function dropRoom() { if (S.es) S.es.close(); S.es = null; ls.del('pb_code'); S.code = null; S.room = null; S.sheetFor = null; S.bidDraft = ''; loadScores(); loadRivals(); }
function leaveRoom() { api('leave').catch(() => {}); dropRoom(); render(); }
const startGame = () => act(() => api('start'));
const backToLobby = () => act(() => api('lobby'));
const skipMissing = () => act(() => api('skip'));
function lockBid() {
  const bid = parseInt(S.bidDraft, 10);
  if (!Number.isFinite(bid) || bid < 0) { S.error = 'Bid a whole number, 0 or more.'; return render(); }
  act(() => api('bid', { bid }));
}

function onChange() {
  const r = S.room;
  if (r.status === 'over' && S.lastStatus !== 'over') setTimeout(() => { loadScores(); loadRivals(); }, 600); // the server saves the result just after the last round
  S.lastStatus = r.status;
  if (r.status === 'lobby' || (r.status === 'playing' && !r.lastResult)) S.seen = 0;
  if (r.lastResult && r.lastResult.round > S.seen && S.sheetFor == null) S.sheetFor = r.lastResult.round;
  render();
}
function closeSheet() { S.seen = S.sheetFor; S.sheetFor = null; S.bidDraft = ''; render(); }

// ---------- helpers ----------
const nickOf = id => ((S.room.players.find(p => p.id === id)) || {}).nick || 'Someone';
const pl = id => S.room.players.find(p => p.id === id) || {};
const inGame = () => S.room.order.includes(S.room.me);

// ---------- rendering ----------
function render() {
  const active = document.activeElement && document.activeElement.id;
  const caret = active && document.activeElement.selectionStart;
  app.innerHTML = view();
  maybeCelebrate();
  if (active) { const el = document.getElementById(active); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} } }
}
function view() {
  if (!S.code || !S.room) return homeView() + flagSheetView();
  const body = S.room.status === 'lobby' ? lobbyView() : S.room.status === 'over' ? overView() : gameView();
  return `<div class="topbar"><span class="muted small">Room <span class="code">${esc(S.code)}</span></span><button class="link" onclick="leaveRoom()">Leave</button></div>`
    + body + (S.error ? `<p class="err">${esc(S.error)}</p>` : '') + sheetView() + flagSheetView();
}
function homeView() {
  return `<header class="harbor">
    <h1>Puerto Banana</h1>
    ${heroScene(0.75, 'hero', S.hull, S.flag, true)}
    <p class="harbor-foot">Bid blind for the banana cargo. Win it and you pay the runner-up the gap. First to ${GOAL} bananas wins.</p>
  </header>
  <div class="stack">
    <div><label for="nick">Your name</label><input id="nick" class="text" maxlength="20" value="${esc(S.nick)}" oninput="S.nick=this.value;ls.set('pb_nick',this.value)" onchange="loadRivals()" autocomplete="nickname"></div>
    <div><span class="label" id="hull-l">Ship colour</span>
    <div class="hullpick"><div class="swatches" role="radiogroup" aria-labelledby="hull-l">${Object.entries(HULLS).map(([k, [name, c]]) =>
      `<button id="hull-${k}" class="swatch" role="radio" aria-checked="${S.hull === k}" aria-label="${name}" style="--c:${c}" onclick="pickHull('${k}')"></button>`).join('')}</div>
    ${tile(0.5, false, 'preview', S.hull, S.flag, true)}</div></div>
  </div>
  <div class="divider"></div>
  <label for="join">Join with a code</label>
  <div class="row"><input id="join" class="text code grow" maxlength="4" value="${esc(S.joinCode)}" oninput="S.joinCode=this.value" placeholder="ABCD" autocapitalize="characters">
  <button onclick="enterRoom(S.joinCode)" ${S.busy?'disabled':''}>Join</button></div>
  <p class="or">or start your own</p>
  <button class="primary wide" onclick="createRoom()" ${S.busy?'disabled':''}>Create a room</button>
  ${S.error ? `<p class="err" style="margin-top:12px">${esc(S.error)}</p>` : ''}
  <details><summary>How a round works</summary><div class="small" style="margin-top:8px">
  <p>The container holds as many bananas as the richest player. Everyone secretly bids any number, even more than they own.</p>
  <p>Highest bid takes the container, then pays the second-highest the difference between their bids. Tied for highest? They split the container and pay nothing.</p>
  <p>Can't afford the payment? With 3+ players you lose your whole stock and the next-highest bidder wins instead. With 2 players you just drop out of that auction.</p></div></details>
  <div class="divider"></div>
  ${rivalsView()}
  <div class="divider"></div>
  ${logView()}`;
}
// Each line takes its captain's hull colour; a clash gets the first colour nobody in the chart uses.
function rivalColors(players) {
  const used = new Set(), out = {};
  for (const p of players) {
    const k = HULLS[p.hull] && !used.has(p.hull) ? p.hull : Object.keys(HULLS).find(h => !used.has(h)) || 'navy';
    used.add(k); out[p.key] = HULLS[k][1];
  }
  return out;
}
function rivalsChart(d, colors) {
  const W = 340, H = 200, L = 34, R = 330, T = 16, B = 172, n = d.games.length;
  const X = i => L + (n > 1 ? i * (R - L) / (n - 1) : (R - L) / 2), Y = r => T + (1 - r) * (B - T);
  const day = iso => new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  let s = [0, 0.5, 1].map(r => `<line class="rv-grid" x1="${L}" x2="${R}" y1="${Y(r)}" y2="${Y(r)}"/>`
    + `<text class="rv-tick" x="${L - 6}" y="${Y(r) + 4}" text-anchor="end">${r * 100}%</text>`).join('');
  s += `<text class="rv-tick" x="${L}" y="${H - 6}">${esc(day(d.games[0]))}</text>`
    + `<text class="rv-tick" x="${R}" y="${H - 6}" text-anchor="end">${esc(day(d.games[n - 1]))}</text>`;
  for (const p of d.players.slice().reverse()) { // leader drawn last, on top
    if (!p.points.length) continue;
    const cls = 'rv-line' + (p.key === d.me ? ' rv-me' : '') + (S.rivalHi && S.rivalHi !== p.key ? ' rv-faded' : '');
    const path = p.points.map(([i, r], k) => `${k ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(r).toFixed(1)}`).join('');
    const [li, lr] = p.points[p.points.length - 1];
    s += `<g class="${cls}" style="--c:${colors[p.key]}"><path d="${path}"/><circle cx="${X(li).toFixed(1)}" cy="${Y(lr).toFixed(1)}" r="4.5"/></g>`;
  }
  const lead = d.players[0];
  return `<svg class="rv-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Win rate chart. ${esc(lead.name)} leads with ${Math.round(lead.won / lead.played * 100)}% of ${lead.played} games won.">${s}</svg>`;
}
function rivalsView() {
  const d = S.rivals;
  let body;
  if (d === null) body = `<p class="muted">Charting the rivalry…</p>`;
  else if (d === 'error') body = `<p class="muted">The rivalry chart can't be read right now. You can still play.</p>`;
  else if (!d.players.length) body = `<p class="muted">No voyages logged yet. Finish a game to start the chart.</p>`;
  else {
    const colors = rivalColors(d.players), anyLine = d.players.some(p => p.points.length);
    // Chips toggle by index: names may contain quotes, so they never go inside onclick.
    body = `<div class="card">${anyLine ? rivalsChart(d, colors) : `<p class="muted small">Lines appear from each captain's 3rd game.</p>`}
      <ul class="rv-legend">${d.players.map((p, i) => `<li><button class="rv-chip" aria-pressed="${S.rivalHi === p.key}" onclick="toggleRival(${i})">
        <span class="rv-dot" style="background:${colors[p.key]}"></span><span class="rv-name">${esc(p.name)}${p.key === d.me ? ' (you)' : ''}</span>
        <span class="rv-stat">${p.won} of ${p.played} won · ${Math.round(p.won / p.played * 100)}%</span></button></li>`).join('')}</ul></div>`;
  }
  const title = d && d !== 'error' && d.mode === 'active' ? 'Most active captains' : 'You and your rivals';
  return `<section class="rivals" aria-labelledby="rv-h"><h2 id="rv-h">Rivals</h2><p class="muted small">${title} · win rate game by game</p><div aria-live="polite">${body}</div></section>`;
}
function logView() {
  const sc = S.scores;
  let body;
  if (sc === null) body = `<p class="muted">Reading the harbour log…</p>`;
  else if (sc === 'error') body = `<p class="muted">The harbour log can't be read right now. You can still play; check back later.</p>`;
  else if (!sc.length) body = `<p class="muted">No voyages logged yet. Win a game to be the first name here.</p>`;
  else body = `<ol>${sc.map((e, i) => `<li><span class="rank">${i + 1}</span><span class="who">${esc(e.name)}</span><span class="score">${esc(e.score)} 🍌</span><span class="when">${esc(fmtDate(e.completedAt))}</span></li>`).join('')}</ol>`;
  return `<section class="log" aria-labelledby="log-h"><h2 id="log-h">Harbour log</h2><p class="muted small">The 20 biggest winning hauls.</p><div aria-live="polite">${body}</div></section>`;
}
function fmtDate(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); }
function lobbyView() {
  const ps = S.room.players, n = ps.length;
  return `<h2>Waiting at the dock</h2>
  <p class="muted">Tell friends to join with code <b class="code">${esc(S.code)}</b>.</p>
  <div class="card"><ul class="players">${ps.map((p, i) => `<li>${tile(0, true, p.id, p.hull, p.flag)}<span class="name">${esc(p.nick)}${p.id===S.room.me?' (you)':''}</span><span class="status">${i>=MAX_PLAYERS?'watching':'ready'}</span></li>`).join('')}</ul></div>
  <div style="margin-top:16px"><button class="primary wide" onclick="startGame()" ${n<2||S.busy?'disabled':''}>${n<2?'Need at least 2 players':'Start game with '+Math.min(n,MAX_PLAYERS)}</button></div>`;
}
function playersList(withStatus) {
  const r = S.room;
  const ids = r.order.slice().sort((a, b) => r.inventories[b] - r.inventories[a]);
  return `<ul class="players">${ids.map(id => {
    const inv = r.inventories[id];
    const st = withStatus ? (pl(id).locked ? `<span class="status ok">Bid locked</span>` : `<span class="status">Thinking…</span>`) : '';
    return `<li class="${id===r.me?'me':''}">${tile(inv / GOAL, true, id, hullOfId(id), flagOfId(id))}<span class="name">${esc(nickOf(id))}${id===r.me?' (you)':''}</span><span class="inv">${inv}</span>${st}</li>`;
  }).join('')}</ul>`;
}
function gameView() {
  const r = S.room;
  const waiting = r.order.filter(id => !pl(id).locked).length;
  let action;
  if (!inGame()) action = `<p class="muted">You're watching this game.</p>`;
  else if (r.myBid !== null) action = `<div class="card locked"><div class="muted small">Your bid is sealed and lashed down</div><div class="num">${r.myBid}</div>
    <div class="muted small">Waiting for ${waiting} more</div></div>`;
  else action = `<label for="bid">Your secret bid</label>
    <div class="bidbox"><button aria-label="Lower bid" onclick="nudge(-1)">−</button>
    <input id="bid" inputmode="numeric" pattern="[0-9]*" value="${esc(S.bidDraft)}" placeholder="0" oninput="S.bidDraft=this.value.replace(/\\D/g,'')">
    <button aria-label="Raise bid" onclick="nudge(1)">+</button></div>
    <button class="primary wide" style="margin-top:12px" onclick="lockBid()" ${S.busy?'disabled':''}>Lock in bid</button>`;
  const skip = r.isHost && waiting > 0 && waiting < r.order.length
    ? `<button class="link" onclick="skipMissing()">Someone gone? Count missing bids as 0</button>` : '';
  const mine = r.inventories[r.me];
  return `<div class="potcard"><span class="plate">Round ${r.round}</span>
    <div class="num">${r.pot} 🍌</div><div class="sub">up for auction this round</div></div>
    ${inGame() ? `<div class="myship" role="img" aria-label="Your ship: ${mine} bananas, ${cargoWord(mine / GOAL).toLowerCase()}">${heroScene(mine / GOAL, r.me, hullOfId(r.me), flagOfId(r.me), true)}
    <div class="myship-foot"><span>Your ship<br><b>${cargoWord(mine / GOAL)}</b></span><span class="num">${mine} 🍌</span></div></div>` : ''}
    <div style="margin:12px 0 18px">${action}</div>
    <div class="card">${playersList(true)}</div>${skip}
    ${historyView()}`;
}
function nudge(d) { S.bidDraft = String(Math.max(0, (parseInt(S.bidDraft, 10) || 0) + d)); render(); }
function overView() {
  const r = S.room, w = r.winners || [];
  return `<div class="card winner">${tile(Math.max(1.6, r.inventories[w[0]] / GOAL), false, w[0], hullOfId(w[0]), flagOfId(w[0]))}<div class="muted">King of the bananas</div>
    <div class="num">${w.map(id => esc(nickOf(id))).join(' & ')}</div>
    <div class="muted">${r.inventories[w[0]]} bananas after ${r.round - 1} rounds</div></div>
    <div class="card" style="margin-top:14px">${playersList(false)}</div>
    <button class="primary wide" style="margin-top:16px" onclick="backToLobby()">Back to the lobby</button>
    ${historyView()}`;
}
function historyView() {
  const h = (S.room.history || []).slice().reverse();
  if (!h.length) return '';
  return `<details><summary>Earlier rounds</summary><div class="hist">${h.map(x =>
    `<div><b>Round ${x.round}</b>, ${x.pot} 🍌: ${S.room.order.map(id => esc(nickOf(id)) + ' ' + x.bids[id]).join(', ')}</div>`).join('')}</div></details>`;
}
// Round results in plain sentences: who won, who gains what, who pays whom. "You" for the viewer.
const bn = n => `${n} banana${n === 1 ? '' : 's'}`;
function stepLines(s) {
  const me = id => id === S.room.me;
  const n = id => me(id) ? '<b>You</b>' : `<b>${esc(nickOf(id))}</b>`;
  const to = id => me(id) ? '<b>you</b>' : `<b>${esc(nickOf(id))}</b>`;
  const v = (id, verb, third = verb + 's') => me(id) ? verb : third;
  const and = (ids, f = n) => ids.map((id, i) => i ? to(id) : f(id)).join(' and ');
  switch (s.t) {
    case 'win': return [
      `${n(s.id)} ${v(s.id, 'win')} the auction with the highest bid, ${s.bid}.`,
      `${n(s.id)} ${v(s.id, 'gain')} the ${bn(s.gain)} up for auction.`,
      s.premium
        ? `${n(s.id)} ${v(s.id, 'pay')} ${bn(s.premium)} to ${s.to.map(to).join(' and ')}${s.to.length > 1 ? `, ${s.share} each` : ''}: the gap between ${s.bid} and the next bid, ${s.second}.`
        : `${n(s.id)} ${v(s.id, 'pay')} nothing: the next bid was also ${s.second}.`];
    case 'tie': return [
      `${and(s.ids)} tied with the highest bid, ${s.bid}.`,
      `They split the auction: each gains ${bn(s.share)}. Nobody pays.`];
    case 'bust': return [
      `${n(s.id)} ${v(s.id, 'bid')} ${s.bid} but can't pay the ${bn(s.premium)} owed.`,
      s.keeps ? `${n(s.id)} ${v(s.id, 'drop', 'drops')} out of this auction and ${v(s.id, 'keep')} ${me(s.id) ? 'your' : 'their'} bananas.`
        : `${n(s.id)} ${v(s.id, 'lose')} all ${bn(s.lost)}.`];
    case 'last': return [`${n(s.id)} ${v(s.id, 'are', 'is')} the last bidder left and ${v(s.id, 'gain')} all ${bn(s.gain)}.`];
    default: return ['Nobody won the auction.'];
  }
}
// ---------- victory show (visual only; never touches scores) ----------
const PARTY_COLORS = ['#FFD60A', '#FF3E8A', '#3FD0E0', '#FF9F1C', '#2BB673', '#FFFFFF'];
const rand = (lo, hi) => lo + Math.random() * (hi - lo);
function maybeCelebrate() {
  const r = S.room;
  if (!r || r.status !== 'over' || S.sheetFor != null) return;
  const key = r.code + ':' + (r.history || []).length;
  if (S.celebrated === key) return;
  S.celebrated = key;
  celebrate(r);
}
function celebrate(r) {
  document.getElementById('party')?.remove();
  const party = document.createElement('div');
  party.id = 'party'; party.setAttribute('aria-hidden', 'true');
  document.body.appendChild(party);
  const rivals = r.order.filter(id => !r.winners.includes(id));
  const torpedo = r.torpedo && rivals.length > 0;
  const names = ids => ids.map(id => esc(nickOf(id))).join(' and ');
  const sankLine = `💥 Torpedoes sank ${names(rivals)}!`;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    party.innerHTML = `<div class="party-banner">🎉 ${names(r.winners)} ${r.winners.length > 1 ? 'win' : 'wins'}!${torpedo ? '<br>' + sankLine : ''}</div>`;
    return setTimeout(() => party.remove(), 5000);
  }
  let t = 0;
  if (torpedo) { party.insertAdjacentHTML('beforeend', battleView(r, rivals, sankLine)); t = 1.2 + rivals.length * 0.7 + 1.6; }
  setTimeout(() => {
    party.querySelector('.battle')?.remove();
    party.insertAdjacentHTML('beforeend', rainView() + fireworksView());
  }, t * 1000);
  setTimeout(() => party.remove(), (t + 7) * 1000);
}
function rainView() {
  let h = '';
  for (let i = 0; i < 46; i++) {
    const w = rand(26, 52), r0 = rand(-90, 90);
    h += `<svg class="drop" viewBox="0 0 26 12" style="--x:${rand(-4, 98).toFixed(1)}vw;--w:${w.toFixed(0)}px;--t:${rand(2.4, 4.4).toFixed(2)}s;--d:${rand(0, 2.2).toFixed(2)}s;--r0:${r0.toFixed(0)}deg;--r1:${(r0 + rand(-540, 540)).toFixed(0)}deg"><use href="#nana"/></svg>`;
  }
  return h;
}
function fireworksView() {
  let h = '';
  for (let b = 0; b < 7; b++) {
    const c = PARTY_COLORS[b % PARTY_COLORS.length], d = (b * 0.55 + rand(0, 0.3)).toFixed(2), len = rand(60, 110).toFixed(0);
    h += `<div class="burst" style="--x:${rand(12, 88).toFixed(0)}%;--y:${rand(10, 45).toFixed(0)}%">`;
    for (let i = 0; i < 14; i++) h += `<i style="--a:${(i * 360 / 14).toFixed(0)}deg;--c:${c};--d:${d}s;--len:${len}px"></i>`;
    h += '</div>';
  }
  return h;
}
// The winner's ship (left) torpedoes each rival (right) in turn; hit ships tip over and sink.
function battleView(r, rivals, line) {
  const W = 360, sea = 150, win = r.winners[0];
  const s = Math.min(0.42, 180 / (rivals.length * 220)), gap = (W - 150) / rivals.length;
  let rivalsSvg = '', shots = '';
  rivals.forEach((id, i) => {
    const x = 150 + i * gap + (gap - 220 * s) / 2, cx = x + 110 * s, hit = 1.2 + i * 0.7 + 0.8;
    rivalsSvg += `<g transform="translate(${x.toFixed(1)} ${(sea - 92 * s).toFixed(1)}) scale(${s.toFixed(3)})"${hullStyle(hullOfId(id))}>
      <g class="sinking" style="--d:${hit.toFixed(2)}s">${shipBody(r.inventories[id] / GOAL, 'sunk' + id, flagOfId(id)).ship}</g></g>`;
    shots += `<g class="torp" style="--d:${(hit - 0.8).toFixed(2)}s;--dx:${(cx - 118).toFixed(0)}px"><path d="M100 ${sea + 5}h14" stroke="#fff" stroke-width="2" opacity=".8"/>
      <rect x="112" y="${sea + 3}" width="12" height="4" rx="2" fill="#22313F"/></g>
      <circle class="boom" style="--d:${hit.toFixed(2)}s" cx="${cx.toFixed(0)}" cy="${sea - 4}" r="16" fill="#FF9F1C"/>
      <circle class="boom" style="--d:${(hit + 0.1).toFixed(2)}s" cx="${cx.toFixed(0)}" cy="${sea - 4}" r="9" fill="#FFD60A"/>
      ${[0, 1, 2].map(k => `<circle class="bubble" style="--d:${(hit + 0.6 + k * 0.2).toFixed(2)}s" cx="${(cx - 6 + k * 6).toFixed(0)}" cy="${sea + 10}" r="${2 + k % 2}" fill="#fff" opacity="0"/>`).join('')}
      <use class="flotsam" style="--d:${(hit + 1.2).toFixed(2)}s" href="#nana" x="${(cx - 9).toFixed(0)}" y="${sea + 6}" width="18" height="9"/>`;
  });
  const wb = shipBody(0.85, 'battle' + win, flagOfId(win)).ship; // drawn riding high so the attacker reads clearly
  return `<div class="battle"><svg viewBox="0 84 ${W} 106" style="display:block;width:100%">
    ${waves(sea - 4, W, 190, 'sh-sea2')}
    <g transform="translate(4 ${(sea - 92 * 0.62).toFixed(1)}) scale(0.62)"${hullStyle(hullOfId(win))}>${wb}</g>${rivalsSvg}
    ${waves(sea + 1, W, 190, 'sh-sea sh-wave')}${shots}</svg><p>${line}</p></div>`;
}
function sheetView() {
  const r = S.room.lastResult;
  if (S.sheetFor == null || !r || r.round !== S.sheetFor) return '';
  const ids = S.room.order.slice().sort((a, b) => r.bids[b] - r.bids[a]);
  const top = r.bids[ids[0]];
  return `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-label="Round results">
    <h2>Round ${r.round} results</h2>
    <ul class="story">${r.steps.flatMap(stepLines).map(l => `<li>${l}</li>`).join('')}</ul>
    <ul class="reveal">${ids.map((id, i) => { const b = r.before[id], a = r.after[id], d = a - b;
      return `<li class="${r.bids[id]===top?'top':''}" style="animation-delay:${i*0.12}s">${tile(a / GOAL, true, id, hullOfId(id), flagOfId(id))}
        <span class="who"><b>${esc(nickOf(id))}${id===S.room.me?' (you)':''}</b>
        <span class="small">Bananas ${b} → <b>${a}</b> <span class="delta ${d>0?'up':d<0?'down':''}">(${d>0?'+'+d:d<0?'−'+(-d):'no change'})</span></span></span>
        <span class="bid"><span class="small muted">Bid</span><span class="num">${r.bids[id]}</span></span></li>`; }).join('')}</ul>
    <button class="primary wide" onclick="closeSheet()">${S.room.status==='over'?'See the winner':'Next round'}</button></div></div>`;
}
// ---------- flag picker sheet ----------
async function loadCountries() {
  try {
    const r = await fetch(FLAG_CDN + 'country.json');
    if (!r.ok) throw new Error();
    S.countries = (await r.json()).filter(c => c.iso || FLAG_EXTRAS.includes(c.code))
      .map(c => ({ code: c.code, name: c.name })).sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { S.countries = 'error'; }
  if (S.flagSheet) fillFlags();
}
function openFlags(e) {
  if (e) e.stopPropagation();
  S.flagSheet = true; S.flagQuery = '';
  if (!Array.isArray(S.countries)) { S.countries = null; loadCountries(); }
  render();
}
function closeFlags() { S.flagSheet = false; render(); }
const flagThumb = k => FLAG_EGGS[k] ? `<svg viewBox="0 0 40 30" aria-hidden="true"><use href="#flag-${k}"/></svg>`
  : k ? `<img src="${FLAG_CDN}flags/4x3/${k}.svg" alt="" loading="lazy">`
  : `<svg viewBox="0 0 40 30" aria-hidden="true"><path d="M4 4 36 15 4 26Z" fill="var(--hibiscus)"/></svg>`;
// Pirate is the visible teaser; the other easter eggs only surface when you search their words.
function flagItems() {
  const q = S.flagQuery.trim().toLowerCase();
  const eggs = Object.entries(FLAG_EGGS).filter(([k, [, words]]) => k === 'pirate' || (q.length >= 3 && words.some(w => w.startsWith(q) || q.startsWith(w))));
  const cs = Array.isArray(S.countries) ? S.countries.filter(c => !q || c.name.toLowerCase().includes(q) || c.code === q) : [];
  const items = [['', 'Pennant'], ...eggs.map(([k, [name]]) => [k, name]), ...cs.map(c => [c.code, c.name])];
  const note = S.countries === null ? `<p class="muted small">Unrolling the flag locker…</p>`
    : S.countries === 'error' ? `<p class="muted small">The country flags can't be loaded right now.</p>`
    : !cs.length && q && !eggs.some(([, [, words]]) => words.some(w => w.startsWith(q) || q.startsWith(w))) ? `<p class="muted small">No flag matches "${esc(S.flagQuery)}".</p>` : '';
  return items.map(([k, name]) => `<button class="flagbtn" aria-pressed="${S.flag === k}" onclick="pickFlag('${k}')">${flagThumb(k)}<span>${esc(name)}</span></button>`).join('') + note;
}
function fillFlags() { const el = document.getElementById('flaglist'); if (el) el.innerHTML = flagItems(); }
function flagSheetView() {
  if (!S.flagSheet) return '';
  return `<div class="sheet-bg" onclick="if(event.target===this)closeFlags()"><div class="sheet" role="dialog" aria-label="Choose your ship's flag">
    <div class="topbar"><h2>Raise your flag</h2><button class="link" onclick="closeFlags()">Done</button></div>
    <input id="flagq" class="text" type="search" placeholder="Search flags: Sweden, se…" value="${esc(S.flagQuery)}" oninput="S.flagQuery=this.value;fillFlags()" autocomplete="off">
    <div class="flaggrid" id="flaglist">${flagItems()}</div></div></div>`;
}
function pickFlag(k) {
  S.flag = flagOf(k); ls.set('pb_flag', S.flag);
  if (S.code) api('join', { code: S.code, nick: S.nick, hull: S.hull, flag: S.flag }).catch(() => {}); // opponents see it too
  render();
  if (FLAG_EGGS[S.flag]) document.querySelectorAll('.harbor .scene, .myship .scene').forEach(el => { el.classList.add('wiggle'); setTimeout(() => el.classList.remove('wiggle'), 1300); });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'bid') lockBid();
  if (e.key === 'Escape') { if (S.flagSheet) closeFlags(); else if (S.sheetFor != null) closeSheet(); }
});

S.nick = ls.get('pb_nick') || '';
S.hull = HULLS[ls.get('pb_hull')] ? ls.get('pb_hull') : 'navy';
S.flag = flagOf(ls.get('pb_flag'));
function pickHull(k) { S.hull = k; ls.set('pb_hull', k); render(); }
render();
loadScores();
loadRivals();
const saved = ls.get('pb_code'); if (saved) enterRoom(saved, true);
</script>
